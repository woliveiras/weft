        error: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        configurationUpdatedAt: {type: string, format: date-time, description: Changes only when connection configuration changes; discovery health does not advance it.}
        updatedBy: {type: string}
