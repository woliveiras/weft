      properties:
        name: {type: string}
        type: {type: string}
        baseUrl: {type: string}
        defaultModel: {type: string}
        default: {type: boolean}
        timeoutSec: {type: integer}
        maxRetries: {type: integer}
        concurrency: {type: integer}
        source: {enum: [config, managed], description: "config: server configuration (read-only); managed: created through the API"}
        editable: {type: boolean}
        credential:
          type: object
          properties:
            configured: {type: boolean}
            source: {enum: [stored, env, file, none]}
            env: {type: string, description: Variable name for config providers}
            updatedAt: {type: string, format: date-time}
            error: {type: string}
        status: {enum: [ready, unavailable]}
        error: {type: string, description: Why the provider is unavailable}
        lastTest: {$ref: "#/components/schemas/ProviderTestResult"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string}
    ProviderInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        name: {type: string, pattern: "^[a-z0-9]([a-z0-9._-]{0,61}[a-z0-9])?$", description: Required on create; cannot change}
        type: {type: string, description: "openai, anthropic, openrouter, ollama, vllm, lmstudio, huggingface, tgi, mock"}
        baseUrl: {type: string, format: uri}
        defaultModel: {type: string, maxLength: 200}
        timeoutSec: {type: integer, minimum: 0, maximum: 3600}
        maxRetries: {type: integer, minimum: -1, maximum: 10}
        concurrency: {type: integer, minimum: 0, maximum: 1000}
        apiKey:
          description: Omit to keep the stored credential; value replaces it; clear removes it.
          type: object
          additionalProperties: false
          properties:
            value: {type: string, writeOnly: true}
            clear: {type: boolean}
    ProviderTestResult:
      type: object
      properties:
        provider: {type: string}
        ok: {type: boolean, description: True when the test inference succeeded}
        checkedAt: {type: string, format: date-time}
        durationMs: {type: integer}
        draft: {type: boolean}
        model: {type: string}
        models:
          type: object
          properties:
            ok: {type: boolean}
            count: {type: integer}
            error: {type: string}
            defaultModelListed: {type: boolean}
        inference:
          type: object
          properties:
            ok: {type: boolean}
            reply: {type: string}
            stopReason: {type: string}
            inputTokens: {type: integer}
            outputTokens: {type: integer}
            durationMs: {type: integer}
            error: {type: string, description: Redacted error message}
    SCMConnectionInput:
      type: object
      additionalProperties: false
      required: [kind, repository]
      properties:
        name: {type: string, description: Create only}
        kind: {type: string, enum: [github, bitbucket-dc]}
        repository: {type: string, description: owner/name or project/name}
        apiUrl: {type: string}
        gitUrl: {type: string}
        branchPrefix: {type: string, description: "Default weft/"}
        requirePullRequestApproval: {type: boolean, description: Default true}
        token: {type: string, writeOnly: true, description: Omit on update to keep the stored token}
    SCMConnection:
      type: object
      properties:
        name: {type: string}
        kind: {type: string}
        repository: {type: string}
        apiUrl: {type: string}
        gitUrl: {type: string}
        branchPrefix: {type: string}
        requirePullRequestApproval: {type: boolean}
        tokenConfigured: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string}
        tokenUpdatedAt: {type: string, format: date-time}
    Price:
      type: object
      required: [model, inputMicrosPerMTok, outputMicrosPerMTok]
      description: A rate for a provider instance or a plugin type (exactly one) and a model ("*" = any), in micro-units per million tokens.
      properties:
        provider: {type: string}
        type: {type: string}
        model: {type: string}
        inputMicrosPerMTok: {type: integer, format: int64, minimum: 0}
        outputMicrosPerMTok: {type: integer, format: int64, minimum: 0}
        cacheReadMicrosPerMTok: {type: integer, format: int64, minimum: 0, description: Defaults to the input rate}
        cacheWriteMicrosPerMTok: {type: integer, format: int64, minimum: 0, description: Defaults to the input rate}
    BudgetDefinition:
      type: object
      required: [scope, limitMicros]
      properties:
        scope: {type: string, enum: [installation, user, project, workflow]}
        id: {type: string, description: "\"*\" for installation; identity name, project id or source graph id"}
        limitMicros: {type: integer, format: int64, minimum: 1}
        warningPercent: {type: integer, minimum: 0, maximum: 100}
        interruptPercent: {type: integer, description: "0 or 101-1000"}
    BudgetDefinitions:
      type: object
      properties:
        budgets: {type: array, items: {$ref: "#/components/schemas/BudgetDefinition"}}
        period: {type: string, description: Current UTC month (YYYY-MM)}
    SpendLine:
      type: object
      properties:
        key: {type: string}
        model: {type: string}
        calls: {type: integer}
        inputTokens: {type: integer, format: int64}
        outputTokens: {type: integer, format: int64}
        costMicros: {type: integer, format: int64}
        estimatedMicros: {type: integer, format: int64}
        unpricedCalls: {type: integer}
    SpendReport:
      type: object
      properties:
        period: {type: string}
        currency: {type: string}
        total: {$ref: "#/components/schemas/SpendLine"}
        byProvider: {type: array, items: {$ref: "#/components/schemas/SpendLine"}}
        byTask: {type: array, items: {$ref: "#/components/schemas/SpendLine"}}
        byUser: {type: array, items: {$ref: "#/components/schemas/SpendLine"}}
        byProject: {type: array, items: {$ref: "#/components/schemas/SpendLine"}}
        byWorkflow: {type: array, items: {$ref: "#/components/schemas/SpendLine"}}
        truncated: {type: boolean}
    CostPolicy:
      type: object
      properties:
        taskRunBudgetMicros: {type: integer, format: int64}
        warningPercent: {type: integer}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string}
    BudgetView:
      type: object
      properties:
        scope: {type: string}
        id: {type: string}
        currency: {type: string}
        limitMicros: {type: integer, format: int64}
        chargedMicros: {type: integer, format: int64}
        estimatedMicros: {type: integer, format: int64}
        reservedMicros: {type: integer, format: int64}
        remainingMicros: {type: integer, format: int64}
        reached: {type: boolean}
        paused: {type: boolean}
        raisedBy: {type: string}
    PriceCatalogue:
      type: object
      required: [version, currency, unpriced, prices]
      properties:
        version: {type: integer}
        currency: {type: string}
        unpriced: {type: string, enum: [allow, refuse]}
        prices: {type: array, items: {$ref: "#/components/schemas/Price"}}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string}
    ProviderPlugin:
      type: object
      required: [id, label, builtin, local, key, capabilities, enabled, instances]
      properties:
        id: {type: string, description: Provider type stored on instances}
        label: {type: string}
        description: {type: string}
        builtin: {type: boolean}
        local: {type: boolean, description: Talks to a model server the operator runs rather than a hosted API}
        defaultBaseUrl: {type: string}
        key: {type: string, enum: [required, optional, none]}
        capabilities:
          type: object
          properties:
            tools: {type: boolean}
            json: {type: string, enum: [native, instruction]}
            usage: {type: boolean}
            modelListing: {type: boolean}
            streaming: {type: boolean}
        settings: {type: array, items: {type: string, enum: [contextWindow]}}
        devOnly: {type: boolean}
        enabled: {type: boolean}
        enabledBy: {type: string, enum: [config, console]}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string}
        instances: {type: array, items: {type: string}}
    ProviderSettings:
      type: object
      properties:
        revision: {type: integer}
        default: {type: string}
        configDefault: {type: string}
        secrets:
          type: object
          properties:
            enabled: {type: boolean, description: Whether credentials can be stored}
            keySource: {enum: [none, env, file, generated]}
            keyId: {type: string, description: Public identifier of the installation key (not the key)}
        types:
          type: array
          items:
            type: object
            properties:
              type: {type: string}
              label: {type: string}
              defaultBaseUrl: {type: string}
              keyRequired: {type: boolean}
    Error:
      type: object
      required: [error, code]
      properties:
        error: {type: string}
        code: {enum: [invalid, unauthorized, forbidden, not_found, conflict, rate_limited, internal, llm_error, no_answer, secret_key_missing]}
        details: {description: "ValidationReport for 422"}
      example: {error: "conflict: graph was modified (expected version 3)", code: conflict}
    Readiness:
      type: object
      properties:
        storage: {type: string, description: ok or the error}
        queue: {type: string}
    Info:
      type: object
      properties:
        version: {type: string}
        instance: {type: string}
        queue: {type: string, examples: [nats]}
        storage: {type: string, examples: [postgres]}
        providers: {type: array, items: {type: string}}
        defaultProvider: {type: string}
        runtimes: {type: array, items: {type: string}}
        grafanaUrl: {type: string}
        nativeProfile:
          type: boolean
          description: True only when started through the native profile launcher. Does not prove the browser is on the same computer.
        identity:
          type: object
          description: "Caller identity. NOTE: currently serialised with Go field names (Name, Role)."
          properties:
            Name: {type: string}
            Role: {enum: [viewer, operator, admin]}
    AgentOrigin:
      type: object
      required: [workflow, node]
      properties:
        workflow: {type: string}
        node: {type: string}
    AgentSummary:
      type: object
      required: [id, name, latest]
      properties:
        id: {type: string}
        origin: {$ref: "#/components/schemas/AgentOrigin"}
        name: {type: string}
        description: {type: string}
        latest: {type: integer, minimum: 1}
    AgentDefinition:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string}
        description: {type: string}
        prompt: {type: string}
        runtime: {$ref: '../schemas/graph.schema.json#/$defs/Runtime'}
        model: {$ref: '../schemas/graph.schema.json#/$defs/Model'}
        isolation: {$ref: '../schemas/graph.schema.json#/$defs/Isolation'}
        readOnly: {type: boolean}
        tools:
          type: array
          items: {$ref: '../schemas/graph.schema.json#/$defs/ToolGrant'}
        skillIds: {type: [array, "null"], items: {type: string}}
        repositoryGuidance: {$ref: '../schemas/graph.schema.json#/$defs/RepositoryGuidance'}
        parameters:
          type: array
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              name: {type: string}
              description: {type: string}
              default: {type: string}
              required: {type: boolean}
    AgentEntry:
      type: object
      required: [id, versions]
      properties:
        id: {type: string}
        origin: {$ref: "#/components/schemas/AgentOrigin"}
        versions:
          type: array
          items:
            type: object
            required: [version, definition, createdAt, createdBy]
            properties:
              version: {type: integer, minimum: 1}
              definition: {$ref: "#/components/schemas/AgentDefinition"}
              createdAt: {type: string, format: date-time}
              createdBy: {type: string}
              operation: {type: string, description: Optional ID of the confirmed Chat operation that created this version}
    Graph:
      $ref: "../schemas/graph.schema.json"
    Message:
      $ref: "../schemas/message.schema.json"
    Event:
      $ref: "../schemas/event.schema.json"
    Emit:
      $ref: "../schemas/turn.schema.json#/$defs/Emit"
    GraphState: {enum: [stopped, running, paused, stopping, failed]}
    ReplicaState: {enum: [stopped, starting, idle, running, awaiting_approval, paused, stopping, completed, failed]}
    ExecutionStatus: {enum: [pending, running, awaiting_approval, succeeded, failed, cancelled, interrupted]}
    MessageStatus: {enum: [published, held, rejected, delivered, acked, nacked, dead_lettered, dropped]}
    ApprovalStatus: {enum: [pending, approved, rejected, expired]}
    GraphRecord:
      type: object
      properties:
        id: {type: string}
        version: {type: integer}
        desiredState: {$ref: "#/components/schemas/GraphState"}
        state: {$ref: "#/components/schemas/GraphState"}
        runId: {type: string}
        controlOperation: {type: string, readOnly: true, description: ID of the reviewed operation recorded by the latest workflow control}
        changeOperation: {type: string, readOnly: true, description: ID of the reviewed operation that saved this workflow version, when available}
        startedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    GraphSummary:
      type: object
      required: [graph, record]
      properties:
        graph: {$ref: "#/components/schemas/Graph"}
        record: {$ref: "#/components/schemas/GraphRecord"}
    ValidationIssue:
      type: object
      properties:
        path: {type: string, examples: ["spec.channels[2].when"]}
        message: {type: string}
    ValidationReport:
      type: object
      properties:
        valid: {type: boolean}
        errors: {type: array, items: {$ref: "#/components/schemas/ValidationIssue"}}
        warnings: {type: array, items: {$ref: "#/components/schemas/ValidationIssue"}}
    ReplicaStatus:
      $ref: "../schemas/event.schema.json#/$defs/ReplicaStatus"
    EnvironmentDefinition:
      type: object
      properties:
        image: {type: string}
        dockerfile: {type: string}
        target: {type: string, description: Named Dockerfile stage; omitted selects the final stage}
        context: {type: string, description: Repository-relative build context for an accepted definition.}
        setup: {type: array, items: {type: string}}
        network:
          type: object
          properties:
            setup: {type: string, enum: [none, bridge]}
            run: {type: string, enum: [none, bridge]}
        caches: {type: array, items: {type: string}}
        timeout: {type: string}
        cpu: {type: string}
        memory: {type: string}
        origin:
          type: object
          required: [source, path, sha256, files]
          properties:
            source: {type: string}
            path: {type: string}
            sha256: {type: string}
            service: {type: string}
            files: {type: object, additionalProperties: {type: string}}
            target: {type: string, description: Stage chosen during standalone Dockerfile review}
            dockerfilePath: {type: string}
            contextSHA256: {type: string}
    Environment:
      type: object
      required: [graph, state, defined, upToDate]
      properties:
        graph: {type: string}
        state: {enum: [absent, building, ready, failed]}
        defined: {type: boolean, description: The saved graph has spec.environment.}
        scope: {type: string, description: Hashed repository and daemon scope.}
        reuseKey: {type: string, description: Installation-scoped compatibility identity for prepared image and immutable cache snapshots.}
        reused: {type: boolean, description: This build reused a compatible prepared image and cache snapshots.}
        inputs: {type: string, description: Fingerprint of bounded repository manifests and lockfiles.}
        currentHash: {type: string, description: Hash of the saved definition.}
        hash: {type: string, description: Hash of the definition last built.}
        upToDate: {type: boolean, description: Ready and built from the current definition.}
        image: {type: string}
        caches:
          type: array
          items: {type: object, properties: {path: {type: string}, volume: {type: string}}}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        error: {type: string}
        log: {type: string, description: Tail of the build output (at most 64 KiB).}
        actor: {type: string}
        instance: {type: string}
    GraphStatus:
      type: object
      properties:
        graphId: {type: string}
        state: {$ref: "#/components/schemas/GraphState"}
        desiredState: {$ref: "#/components/schemas/GraphState"}
        runId: {type: string}
        version: {type: integer}
        approvalsPending: {type: integer}
        nodes:
          type: array
          items:
            type: object
            properties:
              nodeId: {type: string}
              name: {type: string}
              state: {$ref: "#/components/schemas/ReplicaState"}
              desiredReplicas: {type: integer}
              replicas: {type: array, items: {$ref: "#/components/schemas/ReplicaStatus"}}
              pending: {type: integer, description: Messages waiting for this node across its input groups}
              disabled: {type: boolean}
              stopped: {type: boolean, description: Operator stopped this node}
              paused: {type: boolean}
        channels:
          type: array
          items:
            type: object
            properties:
              channelId: {type: string}
              type: {enum: [queue, topic, fanout, broadcast]}
              from: {type: string}
              to: {type: array, items: {type: string}}
              subject: {type: string, examples: ["software-factory.tasks"]}
              approval: {type: boolean}
              when: {type: string}
              groups:
                type: array
                items:
                  type: object
                  properties:
                    group: {type: string}
                    node: {type: string}
                    replica: {type: integer}
                    pending: {type: integer}
                    inFlight: {type: integer}
                    dead: {type: integer}
    MessageRecord:
      type: object
      properties:
        message: {$ref: "#/components/schemas/Message"}
        graphId: {type: string}
        channel: {type: string}
        group: {type: string, description: Empty for publish-side rows}
        status: {$ref: "#/components/schemas/MessageStatus"}
        attempt: {type: integer}
        consumer: {type: string, description: Execution id that consumed or emitted it}
        error: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Usage:
      type: object
      properties:
        inputTokens: {type: integer, description: Every prompt token processed, including cached ones}
        outputTokens: {type: integer}
        cacheReadTokens: {type: integer, description: Part of inputTokens served from the provider's prompt cache, when reported}
        cacheWriteTokens: {type: integer, description: Part of inputTokens written to the provider's prompt cache, when reported}
    Execution:
      type: object
      properties:
        id: {type: string}
        graphId: {type: string}
        graphVersion: {type: integer}
        runId: {type: string}
        parentExecutionId: {type: string}
        delegationTemplate: {type: string}
        delegationConfig: {$ref: "#/components/schemas/DelegationConfig"}
        delegationObjective: {type: string}
        delegationModel: {type: object, additionalProperties: true}
        approvalId: {type: string}
        nodeId: {type: string}
        replica: {type: integer}
        iteration: {type: integer}
        status: {$ref: "#/components/schemas/ExecutionStatus"}
        inputIds: {type: array, items: {type: string}}
        outputIds: {type: array, items: {type: string}}
        summary: {type: string}
        error: {type: string}
        signal: {type: string}
        usage: {$ref: "#/components/schemas/Usage"}
        toolCalls: {type: integer}
        traceId: {type: string}
        instance: {type: string}
        startedAt: {type: string, format: date-time}
        runtimeStartedAt:
          type: string
          format: date-time
          description: Durable runtime admission after human gates and preparation; not proof of a model call or remote effect.
        completedAt: {type: string, format: date-time}
    Approval:
      type: object
      properties:
        id: {type: string}
        graphId: {type: string}
        nodeId: {type: string}
        replica: {type: integer}
        executionId: {type: string}
        kind: {enum: [tool, message, turn, question, environment, task_environment, delegation]}
        status: {$ref: "#/components/schemas/ApprovalStatus"}
        title: {type: string}
        detail: {description: "tool: {tool,args}; message: {graphId,channel,message,onTimeout}; turn: {inputs,onTimeout}; question: {question}"}
        answer: {type: string}
        decidedBy: {type: string}
        comment: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time}
        decisionOperation: {type: string, readOnly: true, description: ID of the reviewed operation that recorded this decision, when available}
    OperatorMessage:
      type: object
      properties:
        id: {type: string}
        graphId: {type: string}
        nodeId: {type: string}
        replica: {type: integer}
        text: {type: string}
        author: {type: string}
        createdAt: {type: string, format: date-time}
        consumedAt: {type: string, format: date-time}
    ToolSchema:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        parameters: {type: object}
    HumanReview:
      type: object
      required: [id, graphId, nodeId, candidate, state, session, generation, revision, request]
      properties:
        id: {type: string}
        graphId: {type: string}
        nodeId: {type: string}
        replica: {type: integer}
        candidate: {type: string, description: SHA-256 workspace content identity}
        state: {type: string, enum: [pending, approved, changes_requested, rejected, cancelled, expired, superseded]}
        session: {type: string, enum: [none, queued, starting, ready, failed, expired, stopped]}
        generation: {type: integer}
        revision: {type: integer, description: Generation used for decisions}
        request: {type: object, description: Title, instructions, command, port, readiness, TTL, reported checks and optional external URL}
        url: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        sessionExpires: {type: string, format: date-time}
        decidedAt: {type: [string, "null"], format: date-time}
        decidedBy: {type: string}
        method: {type: string}
        comment: {type: string}
        error: {type: string}
    ToolResult:
      type: object
      properties:
        yield: {type: boolean, description: Finish this turn immediately and wait for durable continuation}
        content: {type: string}
        data: {description: "Optional structured output (e.g. shell.exec returns exitCode, stdout, stderr)"}
        isError: {type: boolean}
        truncated: {type: boolean, description: Content capped at 32 KiB}
    ChatMessage:
      type: object
      required: [role]
      properties:
        role: {enum: [system, user, assistant, tool]}
        content: {type: string}
        toolCalls:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string, description: Platform tool name (dots), e.g. filesystem.read}
              arguments: {type: object}
        toolCallId: {type: string}
        name: {type: string}
    ChatRequest:
      type: object
      required: [messages]
      properties:
        model: {type: string, description: Empty = node model}
        system: {type: string}
        messages: {type: array, items: {$ref: "#/components/schemas/ChatMessage"}}
        tools: {type: array, items: {$ref: "#/components/schemas/ToolSchema"}}
        temperature: {type: number}
        maxTokens: {type: integer}
        json: {type: boolean, description: Request a JSON object response}
        stop: {type: array, items: {type: string}}
        metadata: {type: object, additionalProperties: {type: string}}
    ChatResponse:
      type: object
      properties:
        message: {$ref: "#/components/schemas/ChatMessage"}
        stopReason: {type: string, examples: [stop, tool_calls, length]}
        model: {type: string}
        usage: {$ref: "#/components/schemas/Usage"}
