openapi: 3.1.0
info:
  title: Weft Control Plane API
  version: "1.0.0"
  summary: Vendor-neutral agent factory - graphs of continuously running agent loops.
  description: |
    Public REST API (`/api/v1`), live event stream (SSE), health/metrics, and the
    Runtime Protocol v1 callback API (`/internal/v1`) used by external agent runtimes.

    * Authentication: `Authorization: Bearer <token>`. Tokens are static (configured
      with a role) or OIDC JWTs (RS256/ES256). `GET` requests may pass `?access_token=`
      instead (needed by EventSource); never for writes.
    * Roles are hierarchical: `viewer` < `operator` < `admin`. Each operation states the
      minimum role in `x-weft-role`.
    * Errors use the `Error` schema. `details` carries a validation report for 422.
    * JSON field names are camelCase; message metadata keys are snake_case.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
    description: docker compose default
tags:
  - name: system
  - name: graphs
  - name: lifecycle
  - name: environments
  - name: nodes
  - name: messages
  - name: executions
  - name: events
  - name: approvals
  - name: catalog
  - name: chat
  - name: workspace
  - name: mcp
  - name: providers
    description: Model providers - inference plugins enabled by administrators and instances managed through the API with encrypted credentials.
  - name: scm
    description: Server-held source control connections for gateway push and pull request tools.
  - name: cost
    description: Model prices, cost records and monetary budgets.
  - name: runtime-callback
    description: |
      Runtime Protocol v1 callbacks. Called by external agent runtimes during a turn with the
      per-execution token from `TurnInput.callback.token`. The token authorises exactly one
      running execution and stops working when the turn ends. Keep `/internal` off public ingress.
security:
  - bearer: []
paths:
  /api/v1/config/plan:
    post:
      tags: [system]
      summary: Plan declarative installation configuration without writes
      x-weft-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigurationRequest'}
      responses:
        '200':
          description: Per-object field diff, conflicts and safe reference diagnostics; inspect ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigurationReport'}
        '400': {description: Invalid or oversized configuration request}
        '401': {description: Authentication required}
        '403': {description: Administrator role required}
  /api/v1/config/apply:
    post:
      tags: [system]
      summary: Apply explicitly confirmed configuration in dependency order
      description: Requires confirmed and expected revisions from the reviewed plan. Force applies to named baseline conflicts only. No implicit deletion, builds or task starts. Stops after failure and reports partial success. Trigger consent requires recordConsent.
      x-weft-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigurationRequest'}
      responses:
        '200':
          description: Per-object outcome; inspect ok even when HTTP succeeds
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigurationReport'}
        '400': {description: Invalid request or missing confirmation}
        '401': {description: Authentication required}
        '403': {description: Administrator role required}
  /api/v1/config/export:
    get:
      tags: [system]
      summary: Export ordered installation YAML with revisions and preserve references
      x-weft-role: admin
      responses:
        '200':
          description: Secret-free multi-document configuration; no runtime task copies
          content:
            application/yaml:
              schema: {type: string}
        '401': {description: Authentication required}
        '403': {description: Administrator role required}
  /api/v1/repository-imports:
    get:
      summary: List durable public repository imports
      x-weft-role: viewer
      responses:
        '200':
          description: Import records; unfinished expired attempts are reconciled
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/RepositoryImport'}}
    post:
      summary: Confirm HTTPS import with explicit Git authentication or reuse a pinned snapshot
      description: No task execution or permission changes. Shallow smart HTTP fetch, no redirects; native credentials require explicit native-only selection; two active imports per process, three minutes and 128 MiB incoming transfer per attempt. Partial directories are retained. Matching URL/ref reuses the ready commit without refreshing HEAD.
      x-weft-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, confirmed]
              properties:
                url: {type: string, maxLength: 2048, description: Public HTTPS clone URL without credentials, query or fragment; public DNS hostname required}
                ref: {type: string, maxLength: 256, default: HEAD, description: HEAD, full refs/heads/ or refs/tags/ reference, or full commit hash}
                authentication:
                  type: object
                  additionalProperties: false
                  description: Per-attempt credentials are never returned or stored. Native modes use the Weft OS user's configuration; MCP OAuth is unrelated. Authenticated and anonymous URL/ref snapshots have separate reuse keys; a ready snapshot does not revalidate credentials.
                  properties:
                    mode: {enum: [anonymous, token, local_git, local_gh], default: anonymous}
                    username: {type: string, maxLength: 256, writeOnly: true, description: Required for token mode only; no colon or control characters}
                    token: {type: string, maxLength: 8192, writeOnly: true, description: Required for token mode only; no control characters; re-enter for retries}
                confirmed: {type: boolean, const: true}
                retry: {type: boolean, default: false}
                revision: {type: integer, description: Current record revision required for explicit retry}
      responses:
        '202':
          description: Existing ready/active import or new attempt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryImport'}
        '400': {description: Invalid URL/ref/body, missing confirmation or unavailable importer}
        '403': {description: Administrator required}
        '409': {description: Capacity exhausted, stale revision, retry required or prior attempt still finishing}
  /api/v1/repository-imports/{iid}:
    get:
      summary: Inspect progress or reconcile an expired import
      x-weft-role: viewer
      parameters:
        - {in: path, name: iid, required: true, schema: {type: string}}
      responses:
        '200':
          description: Authoritative import state; live bytes are process-local until persisted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryImport'}
        '404': {description: Import not found}
        '409': {description: Concurrent reconciliation; reload current state}
  /api/v1/repository-imports/{iid}/cancel:
    post:
      summary: Request cancellation before project publication
      x-weft-role: admin
      parameters:
        - {in: path, name: iid, required: true, schema: {type: string}}
        - {in: header, name: If-Match, required: true, schema: {type: string}}
      responses:
        '202':
          description: Cancellation state; partial files remain preserved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryImport'}
        '400': {description: Missing or invalid revision}
        '403': {description: Administrator required}
        '404': {description: Import not found}
        '409': {description: Stale revision or import no longer cancellable}
  /api/v1/projects:
    get:
      summary: List explicitly registered server-side Git repositories
      x-weft-role: viewer
      responses:
        '200':
          description: Registered repository metadata; no secrets or automatic execution
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Project'}}
    post:
      summary: Register a repository root after reading its Git metadata
      x-weft-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, path]
              properties:
                name: {type: string, maxLength: 200}
                path: {type: string, maxLength: 4096, description: Absolute path on the Weft server}
      responses:
        '201':
          description: Registered immutable project and initial HEAD commit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {description: Invalid path, unavailable repository or Git failure}
        '403': {description: Administrator required}
  /api/v1/projects/{pid}/preferences:
    put:
      summary: Save an explicitly reviewed execution preference without changing tasks or grants
      x-weft-role: admin
      parameters:
        - {in: path, name: pid, required: true, schema: {type: string}}
        - {in: header, name: If-Match, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [executionMode]
              properties:
                executionMode: {enum: [workflow, local, sandbox]}
      responses:
        '200':
          description: Updated suggestion; task admission still revalidates capabilities and permissions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {description: Invalid preference, missing revision or local mode unavailable in this profile}
        '403': {description: Administrator required}
        '409': {description: Stale project revision}
  /api/v1/tasks/submit:
    post:
      summary: Submit a prompt and start only when effective requirements permit
      x-weft-role: admin
      description: Requires explicit confirmation of existing workflow permissions. Saves/resolves/reviews before existing version-fenced task admission. Missing requirements retain the same draft. Key reservation precedes side effects; identical replays only return current state, never launch again. After repair use a new key and the current draft revision. Uncertain reservations remain retained and require inspection, not automatic replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request, key, confirm]
              properties:
                key: {type: string, minLength: 16, maxLength: 80, pattern: "^[a-zA-Z0-9-]+$"}
                confirm: {type: boolean, const: true}
                request: {type: string, minLength: 1, maxLength: 16384}
                settings:
                  type: object
                  additionalProperties: false
                  properties:
                    title: {type: string, maxLength: 200}
                    executionMode: {enum: [workflow, local, sandbox]}
                    projectId: {type: string}
                    baseCommit: {type: string}
                    source: {$ref: '#/components/schemas/TaskIssueSource'}
                graphId: {type: string, maxLength: 128, description: Explicit workflow selection overrides model suggestions}
                id: {type: string}
                revision: {type: integer, minimum: 1}
      responses:
        '200':
          description: Started/current task or durable blocked draft with review requirements
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: {$ref: '#/components/schemas/TaskDraft'}
                  review: {$ref: '#/components/schemas/TaskReview'}
        '400': {description: Malformed request, unknown field or missing confirmation}
        '403': {description: Administrator authority required}
        '409': {description: Key/input mismatch, stale draft, concurrent change or uncertain reservation}
        '422': {description: Invalid request or admission requirements changed}
        '500': {description: Dependency failure; inspect persisted task before creating a new submission}
  /api/v1/tasks/prompt:
    post:
      summary: Persist and interpret a task request without starting agents (operator)
      description: Saves the original request before a bounded model call. Unresolved drafts survive restart and block admission. Existing drafts require their current revision. Returns actionable resolution states; model errors never expose provider payloads. URLs are identified but not fetched. Only whitelisted fields are accepted; no permission changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request]
              properties:
                request: {type: string, minLength: 1, maxLength: 16384}
                settings:
                  type: object
                  additionalProperties: false
                  properties:
                    title: {type: string, maxLength: 200}
                    executionMode: {enum: [workflow, local, sandbox]}
                    projectId: {type: string}
                    baseCommit: {type: string}
                    source: {$ref: '#/components/schemas/TaskIssueSource'}
                graphId: {type: string, maxLength: 128, description: Explicit workflow selection overrides model suggestions}
                id: {type: string}
                revision: {type: integer, minimum: 1}
      responses:
        '200':
          description: Persisted draft with resolution status; no agents started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDraft'}
        '400': {description: Malformed request or unknown fields}
        '403': {description: Operator authority required}
        '409': {description: Draft changed or is no longer editable}
        '422': {description: Invalid request}
        '500': {description: Storage failure; a pending draft may already have been saved and can be resumed from Tasks}
  /api/v1/tasks:
    get:
      summary: List persisted task drafts (does not list historical agent turns)
      x-weft-role: viewer
      parameters:
        - {in: query, name: after, schema: {type: string}, description: Opaque cursor returned by the preceding page}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: order, schema: {type: string, enum: [updated_desc]}, description: Optional most recently updated first order. Use the same order for every page.}
      responses:
        '200':
          description: Draft page in stable ID order by default or descending update time and ID when requested
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TaskDraft'}}
                  next: {type: string}
        '400': {description: Unknown order or malformed limit}
        '422': {description: Invalid cursor or limit}
    post:
      summary: Save a new task draft without starting agents or changing grants
      x-weft-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskDraftInput'}
      responses:
        '201':
          description: Persisted draft
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDraft'}
        '400': {description: Malformed or unexpected JSON fields}
        '403': {description: Operator role required}
        '404': {description: Workflow not found}
        '409': {description: Selected workflow version changed}
        '422': {description: Invalid request or unavailable entry agent}
  /api/v1/tasks/{tid}:
    parameters:
      - {in: path, name: tid, required: true, schema: {type: string}}
    get:
      summary: Read a task draft
      x-weft-role: viewer
      responses:
        '200':
          description: Persisted draft
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDraft'}
        '404': {description: Draft not found}
    put:
      summary: Update a task draft with revision protection
      x-weft-role: operator
      parameters:
        - {in: header, name: If-Match, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskDraftInput'}
      responses:
        '200':
          description: Updated draft
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDraft'}
        '400': {description: Invalid JSON or missing revision}
        '403': {description: Operator role required}
        '404': {description: Draft or workflow not found}
        '409': {description: Stale draft or workflow version}
        '422': {description: Invalid draft}
    delete:
      summary: Delete an unstarted draft with explicit confirmation and revision protection
      description: |
        Only a task still in draft without an execution copy or environment
        preparation reference can be deleted. A minimal deletion marker fences
        stale edits, model results, repeated submissions and competing admission.
        Deleted IDs return 404 and are omitted from task listings. Repositories,
        imports, workspaces, approvals, audit events and execution history remain.
      x-weft-role: operator
      parameters:
        - {in: header, name: If-Match, required: true, schema: {type: string}, description: Current positive task revision from its ETag}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: {type: boolean, const: true}
      responses:
        '204': {description: Draft deleted; no response body}
        '400': {description: Missing confirmation or positive revision; malformed JSON or unexpected fields}
        '401': {description: Authentication required}
        '403': {description: Operator role required}
        '404': {description: Draft not found or already deleted}
        '409': {description: Stale revision or task already prepared or executed}
        '500': {description: Storage or audit failure; reload the task before retrying}
  /api/v1/tasks/{tid}/retry:
    post:
      summary: Create a fresh linked draft from a failed manual task
      description: |
        Copies only editable input and server-owned retry provenance. Does not
        start, prepare, authorize or modify the source task. One child is retained
        per source revision; replays return that child even after editing or start.
        Deleted children are not recreated. Trigger tasks use trigger recovery.
      x-weft-role: operator
      parameters:
        - {in: path, name: tid, required: true, schema: {type: string}}
        - {in: header, name: If-Match, required: true, schema: {type: string}, description: Current positive source task revision}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: {type: boolean, const: true}
      responses:
        '201':
          description: Fresh draft created without execution or consent
          headers:
            ETag: {schema: {type: string}}
            Location: {schema: {type: string}, description: API path of the child task}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDraft'}
        '200':
          description: Existing child returned; may already have been edited or started
          headers:
            ETag: {schema: {type: string}}
            Location: {schema: {type: string}, description: API path of the child task}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDraft'}
        '400': {description: Invalid confirmation, revision, JSON or unexpected fields}
        '401': {description: Authentication required}
        '403': {description: Operator role required}
        '404': {description: Source task not found}
        '409': {description: Stale source, nonfailed or trigger-owned source, or deleted child}
        '500': {description: Audit or storage failure; repeat the same request to recover an uncertain committed child}
  /api/v1/tasks/{tid}/review:
    get:
      summary: Preview current workflow requirements without admitting execution
      x-weft-role: viewer
      parameters:
        - {in: path, name: tid, required: true, schema: {type: string}}
      responses:
        '200':
          description: Current validation and launch blockers
          content:
            application/json:
              schema:
                type: object
                required: [task, currentGraphVersion, validation, blockers, canStart]
                properties:
                  task: {$ref: '#/components/schemas/TaskDraft'}
                  currentGraphVersion: {type: integer}
                  validation: {type: object}
                  blockers: {type: array, items: {type: string}}
                  canStart: {type: boolean}
                  canPrepareEnvironment: {type: boolean}
                  environmentDefinition: {type: object}
                  environment: {type: object}
                  executionGraphId: {type: string}
                  grants: {type: array, items: {type: object}}
                  model: {type: object}
                  isolation: {type: string}
                  agents: {type: array, items: {type: object}}
                  project: {$ref: '#/components/schemas/Project'}
                  workspacePath: {type: string}
        '404': {description: Task or workflow not found}
  /api/v1/tasks/{tid}/progress:
    get:
      summary: Read owned executions and conservative result projection
      x-weft-role: viewer
      parameters:
        - {in: path, name: tid, required: true, schema: {type: string}}
      responses:
        '200':
          description: Persisted task, observed state, bounded executions, optional result and blockers
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: {$ref: '#/components/schemas/TaskDraft'}
                  state: {type: string}
                  workspacePath: {type: string}
                  workspaces: {type: array, items: {type: object}, description: Prepared agent/replica paths and exact Git inspection scope}
                  environment: {type: object}
                  pendingApprovals: {type: array, items: {type: object}}
                  executions: {type: array, items: {type: object}}
                  result: {type: object}
                  blockers: {type: array, items: {type: string}}
        '404': {description: Task not found}
  /api/v1/tasks/{tid}/start:
    post:
      summary: Claim a draft revision and start an explicitly reviewed execution copy
      x-weft-role: admin
      parameters:
        - {in: path, name: tid, required: true, schema: {type: string}}
        - {in: header, name: If-Match, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [confirm], properties: {confirm: {const: true}}}
      responses:
        '202':
          description: Claimed task; repeated submissions return existing state without dispatching another start
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDraft'}
        '400': {description: Missing confirmation or revision}
        '403': {description: Administrator required}
        '409': {description: Stale revision or ownership conflict}
        '422': {description: Unsupported or invalid workflow requirements}
  /api/v1/tasks/{tid}/prepare-environment:
    post:
      summary: Prepare the task-owned environment without starting agents
      x-weft-role: admin
      parameters:
        - {in: path, name: tid, required: true, schema: {type: string}}
        - {in: header, name: If-Match, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [confirm], properties: {confirm: {const: true}}}
      responses:
        '202':
          description: Preparation requested; review build state and explicitly start separately
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDraft'}
        '400': {description: Missing confirmation or revision}
        '403': {description: Administrator required}
        '409': {description: Stale revision or uncertain preparation ownership}
        '422': {description: Invalid workflow or environment requirements}
  /api/v1/tasks/{tid}/cleanup:
    parameters:
      - {in: path, name: tid, required: true, schema: {type: string}}
      - {in: query, name: node, schema: {type: string}, description: Omit for the shared task worktree}
      - {in: query, name: replica, schema: {type: integer, minimum: 0, default: 0}}
    get:
      summary: Preview a stopped registered-project task worktree for explicit cleanup
      x-weft-role: admin
      responses:
        '200':
          description: Current path, branch, HEAD, Git status, cleanliness and review fingerprint
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: {type: string}
                  branch: {type: string}
                  head: {type: string}
                  status: {type: string}
                  clean: {type: boolean}
                  fingerprint: {type: string}
        '403': {description: Administrator required}
        '404': {description: Task or worktree unavailable}
        '409': {description: Task not stopped or workspace ownership conflict}
    post:
      summary: Revalidate a clean worktree review and remove only its checkout; retain branch and history
      x-weft-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, fingerprint]
              properties:
                confirm: {const: true}
                fingerprint: {type: string, minLength: 64, maxLength: 64}
      responses:
        '200': {description: Reviewed checkout removed; branch and source retained}
        '400': {description: Invalid or absent explicit confirmation}
        '403': {description: Administrator required}
        '409': {description: Changed review, dirty checkout, running task or ownership conflict}
  /api/v1/tasks/{tid}/cancel:
    post:
      summary: Stop only the task execution copy while retaining its data
      x-weft-role: admin
      parameters:
        - {in: path, name: tid, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [confirm], properties: {confirm: {const: true}}}
      responses:
        '202': {description: Cancellation requested; inspect progress for settled workers}
        '400': {description: Explicit confirmation required}
        '403': {description: Administrator required}
        '409': {description: Unconfirmed launch or ownership conflict}
  /api/v1/delegation-policy:
    get:
      summary: Read the effective native delegation policy
      x-weft-role: viewer
      responses:
        '200':
          description: Built-in defaults (revision 0) or installation policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DelegationPolicyView'}
    put:
      summary: Replace the native delegation policy
      x-weft-role: admin
      description: Finite limits only. New requests use this revision; waiting requests revalidate before inference. Already-started children retain their snapshots.
      parameters:
        - {in: header, name: If-Match, required: true, schema: {type: string}, description: Current revision including 0 for defaults}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DelegationPolicy'}
      responses:
        '200':
          description: Saved revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DelegationPolicyView'}
        '400': {description: Invalid configuration or missing revision}
        '403': {description: Administrator required}
        '409': {description: Stale revision}
  /api/v1/delegation-profiles:
    get:
      summary: List enabled and disabled native analysis profiles
      x-weft-role: viewer
      responses:
        '200':
          description: Built-in analysis and custom profiles
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DelegationProfileView'}}
    post:
      summary: Create an installation-approved native analysis profile
      x-weft-role: admin
      description: Profiles cannot add tools, credentials, runtimes, model overrides or workspace access.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DelegationProfile'}
      responses:
        '201':
          description: Created revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DelegationProfileView'}
        '400': {description: Invalid profile}
        '403': {description: Administrator required}
        '409': {description: Duplicate profile ID}
  /api/v1/delegation-profiles/{profile}:
    parameters:
      - {in: path, name: profile, required: true, schema: {type: string}}
    get:
      summary: Read a delegation profile revision
      x-weft-role: viewer
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DelegationProfileView'}
        '404': {description: Unknown profile}
    put:
      summary: Update or disable a delegation profile
      x-weft-role: admin
      parameters:
        - {in: header, name: If-Match, required: true, schema: {type: string}, description: Current revision including 0 for the built-in analysis profile}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DelegationProfile'}
      responses:
        '200':
          description: Saved revision; existing execution snapshots remain unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DelegationProfileView'}
        '400': {description: Invalid profile or missing revision}
        '403': {description: Administrator required}
        '404': {description: Unknown profile}
        '409': {description: Stale revision}
  /api/v1/skills:
    get:
      operationId: listSkills
      x-weft-role: viewer
      summary: List installation skills with immutable revision histories
      responses:
        '200':
          description: Skills, including disabled and tombstoned records
          content:
            application/json:
              schema: {type: array, items: {$ref: '../schemas/instructions.schema.json#/$defs/Skill'}}
    post:
      operationId: createSkill
      x-weft-role: admin
      summary: Create a skill at revision 1
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/instructions.schema.json#/$defs/Input'}
      responses:
        '201':
          description: Created; ETag contains revision
          content:
            application/json:
              schema: {$ref: '../schemas/instructions.schema.json#/$defs/Skill'}
        '409': {description: ID already exists}
        '422': {description: Invalid skill fields}
  /api/v1/skills/{sid}:
    parameters:
      - {in: path, name: sid, required: true, schema: {type: string}}
    get:
      operationId: getSkill
      x-weft-role: viewer
      responses:
        '200':
          description: Current revision and history; ETag contains revision
          content:
            application/json:
              schema: {$ref: '../schemas/instructions.schema.json#/$defs/Skill'}
        '404': {description: Unknown skill}
    put:
      operationId: updateSkill
      x-weft-role: admin
      parameters:
        - {in: header, name: If-Match, required: true, schema: {type: string}, description: Current positive revision}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/instructions.schema.json#/$defs/Input'}
      responses:
        '200':
          description: New immutable revision
          content:
            application/json:
              schema: {$ref: '../schemas/instructions.schema.json#/$defs/Skill'}
        '400': {description: Invalid or missing If-Match or malformed JSON}
        '409': {description: Revision conflict}
        '422': {description: Invalid skill fields}
    delete:
      operationId: deleteSkill
      x-weft-role: admin
      parameters:
        - {in: header, name: If-Match, required: true, schema: {type: string}}
      responses:
        '200':
          description: Tombstoned revision; prior history preserved
          content:
            application/json:
              schema: {$ref: '../schemas/instructions.schema.json#/$defs/Skill'}
        '409': {description: Stale revision or a current/active graph selects this skill}
  /api/v1/graphs/{id}/instructions:
    get:
      operationId: inspectInstructions
      x-weft-role: viewer
      summary: Inspect current saved configuration, not an execution snapshot
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: node, required: true, schema: {type: string}}
        - {in: query, name: replica, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Recognized sources, content, hashes and explicit omissions
          content:
            application/json:
              schema: {$ref: '../schemas/instructions.schema.json#/$defs/Snapshot'}
  /api/v1/executions/{eid}/instructions:
    get:
      operationId: getExecutionInstructions
      x-weft-role: viewer
      parameters:
        - {in: path, name: eid, required: true, schema: {type: string}}
      responses:
        '200':
          description: Immutable instruction snapshot recorded before runtime invocation
          content:
            application/json:
              schema: {$ref: '../schemas/instructions.schema.json#/$defs/Snapshot'}
        '404': {description: Unknown execution or no snapshot (legacy or failed before context preparation)}
  /api/v1/reviews:
    get:
      tags: [approvals]
      operationId: listReviews
      summary: List durable application reviews visible to the current reviewer
      x-weft-role: operator
      responses:
        "200":
          description: Safe review views without credentials or internal paths
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/HumanReview"}}
  /api/v1/reviews/{review}/{action}:
    post:
      tags: [approvals]
      operationId: reviewAction
      summary: Decide or operate an authorized application review
      x-weft-role: operator
      parameters:
        - {name: review, in: path, required: true, schema: {type: string}}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [decide, credential, restart, renew, revoke-access, logs]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                state: {type: string, enum: [approved, changes_requested, rejected]}
                method: {type: string, enum: [managed, external, local, without_execution]}
                comment: {type: string, maxLength: 16000}
                revision: {type: integer, description: Required for decide; must equal the current generation}
                browser: {type: boolean, description: Credential action only; one-use exchange when true}
      responses:
        "200":
          description: Review view, private credential with URL, or bounded logs according to action
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/HumanReview"}
                  - {type: object, required: [token, url], properties: {token: {type: string}, url: {type: string}}}
                  - {type: object, required: [logs], properties: {logs: {type: string}}}
        "400": {description: Invalid request or action}
        "403": {description: Reviewer or required method denied}
        "404": {description: Review not found}
        "409": {description: Stale candidate or generation, repeated decision, or unavailable session}
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: {type: object, properties: {status: {const: ok}}}
  /readyz:
    get:
      tags: [system]
      operationId: readyz
      summary: Readiness probe (storage and broker reachable)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}
        "503":
          description: A dependency is not reachable (the failing check carries the error text)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}
  /metrics:
    get:
      tags: [system]
      operationId: metrics
      summary: Prometheus metrics (unauthenticated unless server.protectMetrics is set, then a viewer token is required)
      security: []
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain: {schema: {type: string}}
  /api/v1/info:
    get:
      tags: [system]
      operationId: getInfo
      summary: Platform information
      x-weft-role: viewer
      responses:
        "200":
          description: Info
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Info"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/agents:
    get:
      tags: [catalog]
      operationId: listAgents
      summary: List summaries of reusable agents
      x-weft-role: viewer
      responses:
        "200":
          description: Agent summaries
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/AgentSummary"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [catalog]
      operationId: createAgent
      summary: Publish version 1 of a reusable agent
      x-weft-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, definition]
              additionalProperties: false
              properties:
                id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$'}
                definition: {$ref: "#/components/schemas/AgentDefinition"}
      responses:
        "201": {$ref: "#/components/responses/AgentEntry"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/agents/source:
    get:
      tags: [catalog]
      operationId: getAgentSource
      summary: Read the effective settings of an inline workflow agent
      x-weft-role: viewer
      parameters:
        - {name: workflow, in: query, required: true, schema: {type: string}}
        - {name: node, in: query, required: true, schema: {type: string}}
        - {name: version, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Effective definition from the saved graph version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentDefinition"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/agents/{agent}:
    parameters:
      - {name: agent, in: path, required: true, schema: {type: string}}
    get:
      tags: [catalog]
      operationId: getAgent
      summary: Read a reusable agent and its version history
      x-weft-role: viewer
      responses:
        "200": {$ref: "#/components/responses/AgentEntry"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [catalog]
      operationId: publishAgentVersion
      summary: Publish a new immutable version without changing any workflow
      x-weft-role: admin
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: Current latest version number}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              additionalProperties: false
              properties:
                id: {type: string, description: Must match the path when present}
                definition: {$ref: "#/components/schemas/AgentDefinition"}
      responses:
        "200": {$ref: "#/components/responses/AgentEntry"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/graphs:
    get:
      tags: [graphs]
      operationId: listGraphs
      summary: List graphs with their control records
      x-weft-role: viewer
      responses:
        "200":
          description: Graphs
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/GraphSummary"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [graphs]
      operationId: createGraph
      summary: Create a graph (JSON or YAML)
      x-weft-role: admin
      requestBody: {$ref: "#/components/requestBodies/GraphDocument"}
      responses:
        "201":
          description: Created (version 1)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GraphSummary"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/graphs/validate:
    post:
      tags: [graphs]
      operationId: validateGraph
      summary: Normalise and validate a graph without saving it
      x-weft-role: viewer
      requestBody: {$ref: "#/components/requestBodies/GraphDocument"}
      responses:
        "200":
          description: Validation report (valid or not)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationReport"}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/graphs/{id}:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    get:
      tags: [graphs]
      operationId: getGraph
      summary: Get the latest (or a specific) version of a graph
      x-weft-role: viewer
      parameters:
        - name: version
          in: query
          schema: {type: integer, minimum: 0}
          description: 0 or absent = latest
      responses:
        "200":
          description: Graph
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GraphSummary"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [graphs]
      operationId: updateGraph
      summary: Save a new version (applied live if the graph is running)
      description: |
        Behaviour changes (prompt, model, tools, loop, approvals) apply on each replica's next
        turn; structural changes (runtime, isolation, workspace, cluster comms) restart affected
        replicas gracefully. Send `If-Match: <version>` for optimistic concurrency.
      x-weft-role: admin
      parameters:
        - name: If-Match
          in: header
          schema: {type: string}
          description: Expected current version (e.g. `3`, quotes and `W/` are tolerated)
      requestBody: {$ref: "#/components/requestBodies/GraphDocument"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GraphSummary"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      tags: [graphs]
      operationId: deleteGraph
      summary: Delete a stopped graph definition (all versions, control record) and its broker groups; history is kept
      x-weft-role: admin
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/graphs/{id}/versions:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    get:
      tags: [graphs]
      operationId: listGraphVersions
      x-weft-role: viewer
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    version: {type: integer}
                    createdAt: {type: string, format: date-time}
                    author: {type: string}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/graphs/{id}/export:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    get:
      tags: [graphs]
      operationId: exportGraph
      summary: Download the graph document (attachment)
      x-weft-role: viewer
      parameters:
        - {name: format, in: query, schema: {enum: [yaml, json], default: yaml}}
        - {name: version, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Document
          content:
            application/yaml: {schema: {type: string}}
            application/json: {schema: {$ref: "#/components/schemas/Graph"}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/graphs/{id}/{action}:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - name: action
        in: path
        required: true
        schema: {enum: [start, stop, pause, resume, kill]}
        description: |
          start = new run (clears per-node stops); stop = graceful (in-flight turns finish);
          kill = cancel in-flight turns (inputs are redelivered); pause/resume = no new turns.
    post:
      tags: [lifecycle]
      operationId: graphAction
      x-weft-role: operator
      responses:
        "200":
          description: Status after the action was recorded (convergence is asynchronous)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GraphStatus"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/graphs/{id}/status:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    get:
      tags: [lifecycle]
      operationId: graphStatus
      summary: Live replicas, states and queue depths
      x-weft-role: viewer
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GraphStatus"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/graphs/{id}/environment:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    get:
      tags: [environments]
      operationId: getEnvironment
      summary: Build state of the graph's project environment, compared with the saved definition
      x-weft-role: viewer
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Environment"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/graphs/{id}/environment/discovery:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    get:
      tags: [environments]
      operationId: discoverEnvironment
      summary: Inspect environment candidates in an existing checkout without accepting or building
      x-weft-role: viewer
      responses:
        "200":
          description: Advisory discovery result; invalid candidates block fallback
          content:
            application/json:
              schema:
                type: object
                required: [source, status, candidates]
                properties:
                  source: {type: string, enum: [interface, weft, devcontainer, dockerfile, compose, none]}
                  status: {type: string, enum: [configured, review_required, invalid, proposal_required]}
                  candidates:
                    type: array
                    items:
                      type: object
                      required: [path, sha256]
                      properties:
                        path: {type: string}
                        sha256: {type: string, description: Empty when the file could not be read safely}
                        services: {type: array, items: {type: string}}
                        targets: {type: array, items: {type: string}, description: Named stages for standalone Dockerfiles}
                        error: {type: string}
        "400":
          description: Workspace unavailable or scan failed; no fallback is performed
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/graphs/{id}/environment/resolve:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    post:
      tags: [environments]
      operationId: resolveEnvironment
      summary: Validate a discovered candidate and return its definition for review
      description: >-
        Read-only. Verifies source priority and hash, normalizes supported fields, and records
        referenced file hashes in origin. Acceptance uses the existing admin graph PUT with
        If-Match. Saving and building revalidate the files and definition; neither happens here.
      x-weft-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, path, sha256]
              properties:
                source: {type: string, enum: [weft, devcontainer, dockerfile, compose]}
                path: {type: string}
                sha256: {type: string, minLength: 64, maxLength: 64}
                service: {type: string, description: Required for a Compose candidate}
                target: {type: string, description: Optional named stage for a standalone Dockerfile; omitted selects the final stage}
      responses:
        "200":
          description: Validated environment definition; no save or build performed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnvironmentDefinition"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/graphs/{id}/environment/proposal:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    get:
      tags: [environments]
      operationId: getEnvironmentProposal
      summary: Read durable proposal state and rationale
      x-weft-role: viewer
      responses:
        "200":
          description: Current proposal or null when absent
          content:
            application/json:
              schema: {type: [object, "null"]}
    post:
      tags: [environments]
      operationId: proposeEnvironment
      summary: Analyze manifests without tools and request developer approval
      description: Requires a stopped graph with no environment and no discovered definition. Does not build or execute repository commands. One model call bounded to 90 seconds. Admin approval through Approvals revalidates inputs and saves/builds the definition. Model defaults to the configured provider; resume explicitly opts into starting the graph once ready.
      x-weft-role: admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                model:
                  type: object
                  properties:
                    provider: {type: string}
                    name: {type: string}
                resume: {type: boolean, default: false}
      responses:
        "201": {description: Proposal persisted and awaiting admin approval}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/graphs/{id}/environment/proposal/cancel:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    post:
      tags: [environments]
      operationId: cancelEnvironmentProposal
      summary: Cancel analysis or a pending proposal without building
      x-weft-role: admin
      responses:
        "200": {description: Cancelled proposal}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/graphs/{id}/environment/proposal/retry:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    post:
      tags: [environments]
      operationId: retryEnvironmentProposal
      summary: Revalidate and retry an already approved environment build
      x-weft-role: admin
      responses:
        "200": {description: Current proposal state}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/graphs/{id}/environment/build:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    post:
      tags: [environments]
      operationId: buildEnvironment
      summary: Build the environment of the saved graph version in the background
      description: >-
        Without force, an environment already built from the current definition is left alone (200).
        Otherwise the build starts and the response reports state building (202); follow it with GET or the
        environment.* events. Accepted repository definitions and source hashes are revalidated before any build or cache hit.
      x-weft-role: operator
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: {type: boolean, description: Rebuild even when up to date.}
      responses:
        "200":
          description: Already up to date
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Environment"}
        "202":
          description: Build started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Environment"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/graphs/{id}/environment/reset:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    post:
      tags: [environments]
      operationId: resetEnvironment
      summary: Delete the environment's images and cache volumes (graph must be stopped)
      x-weft-role: admin
      responses:
        "200":
          description: Environment after reset (state absent)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Environment"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/graphs/{id}/nodes/{node}/{action}:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/NodeId"
      - name: action
        in: path
        required: true
        schema: {enum: [start, stop, pause, resume, kill]}
        description: Starting one node of a stopped graph starts the graph with only that node running.
    post:
      tags: [nodes]
      operationId: nodeAction
      x-weft-role: operator
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GraphStatus"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/graphs/{id}/nodes/{node}/scale:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/NodeId"
    put:
      tags: [nodes]
      operationId: scaleNode
      summary: Set replicas (fixed clusters) or the ceiling (autoscaled clusters, saved as a new version)
      x-weft-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replicas]
              properties: {replicas: {type: integer, minimum: 0, maximum: 256}}
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GraphStatus"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/graphs/{id}/nodes/{node}/chat:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/NodeId"
    get:
      tags: [nodes]
      operationId: listOperatorMessages
      summary: Latest 200 operator messages for the node (oldest first)
      x-weft-role: viewer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/OperatorMessage"}}
    post:
      tags: [nodes]
      operationId: sendOperatorMessage
      summary: Send a human message to a node (wakes a waiting replica; withdraws a pending auto-stop)
      x-weft-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, minLength: 1}
                replica: {type: integer, description: "-1 or absent = whichever replica takes its next turn first"}
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperatorMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/graphs/{id}/channels/{channel}/messages:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - name: channel
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [messages]
      operationId: injectMessage
      summary: Inject a message onto a channel (held if the channel has an approval gate)
      x-weft-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: {type: string}
                payload: {description: Any JSON value}
                target: {type: string}
                metadata: {type: object, description: Reserved platform keys are ignored}
            example:
              type: feature.request
              payload: {title: slugify, description: Add a slugify(text) helper.}
      responses:
        "201":
          description: Published (or held)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/graphs/{id}/messages:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    get:
      tags: [messages]
      operationId: listMessages
      summary: Message history (newest first; one row per message, channel and consumer group)
      x-weft-role: viewer
      parameters:
        - {name: channel, in: query, schema: {type: string}, description: "`_unrouted` lists dropped messages"}
        - {name: node, in: query, schema: {type: string}, description: Source or target node}
        - {name: correlationId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/MessageStatus"}}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MessageRecord"}}
  /api/v1/messages/{messageId}:
    get:
      tags: [messages]
      operationId: getMessage
      summary: Every history row of one message
      x-weft-role: viewer
      parameters:
        - {name: messageId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MessageRecord"}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/graphs/{id}/executions:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    get:
      tags: [executions]
      operationId: listExecutions
      summary: Turns (newest first)
      x-weft-role: viewer
      parameters:
        - {name: node, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ExecutionStatus"}}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, default: 50}
      responses:
        "200":
          description: Executions
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Execution"}}
  /api/v1/executions/{executionId}:
    get:
      tags: [executions]
      operationId: getExecution
      x-weft-role: viewer
      parameters:
        - {name: executionId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Execution
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Execution"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/executions/{executionId}/tree:
    get:
      tags: [executions]
      operationId: getExecutionTree
      x-weft-role: viewer
      parameters:
        - {name: executionId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Persisted root and descendants, bounded to 256 nodes and 16 levels; inclusive parent usage must not be summed with child usage.
          content:
            application/json:
              schema:
                type: object
                required: [rootExecutionId, selectedExecutionId, nodes]
                properties:
                  rootExecutionId: {type: string}
                  selectedExecutionId: {type: string}
                  budget:
                    type: object
                    description: Persisted native tree admission accounting; reported plus conservative unknown charges, counted once per model call. Not a billing guarantee. Absent on historical or non-delegating runs.
                    required: [limit, charged, reserved, estimated]
                    properties:
                      limit: {type: integer}
                      charged: {type: integer}
                      reserved: {type: integer}
                      estimated: {type: integer}
                  nodes:
                    type: array
                    maxItems: 256
                    items:
                      type: object
                      required: [execution]
                      properties:
                        execution: {$ref: "#/components/schemas/Execution"}
                        cancellation: {$ref: "#/components/schemas/ExecutionCancellation"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Inconsistent or oversized execution tree; no partial tree returned.}
  /api/v1/executions/{executionId}/cancel:
    post:
      tags: [executions]
      operationId: cancelExecution
      x-weft-role: operator
      parameters:
        - {name: executionId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope, confirm]
              properties:
                scope: {type: string, enum: [child, tree]}
                confirm: {type: boolean, enum: [true]}
      responses:
        "202":
          description: Durable cooperative interruption request; workers own the final outcomes. Repeated requests preserve the first request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: {$ref: "#/components/schemas/ExecutionCancellation"}
                  alreadyTerminal: {type: boolean}
        "200": {description: All target executions already terminal; no new request needed.}
        "400": {description: Invalid scope, child scope used for a root, or missing confirmation.}
        "403": {description: Operator or admin role required.}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Inconsistent or oversized execution tree.}
  /api/v1/graphs/{id}/events:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    get:
      tags: [events]
      operationId: listEvents
      summary: Event log page (ascending by seq)
      description: Without `after`, returns the latest `limit` events (still ascending). With `after`, returns events with seq > after.
      x-weft-role: viewer
      parameters:
        - {name: after, in: query, schema: {type: integer, format: int64}}
        - {name: node, in: query, schema: {type: string}}
        - {name: types, in: query, schema: {type: string}, description: "Comma-separated event types", example: "execution.completed,execution.failed"}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, default: 200}
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Event"}}
  /api/v1/events/stream:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Live event stream (Server-Sent Events)
      description: |
        Frames: `id: <seq>`, `event: <type>`, `data: <Event JSON>`. The stream starts with
        `retry: 3000` and `: connected`, and sends a `: ping` comment after 15 s without events.
        Resume with `?after=<seq>` or the `Last-Event-ID` header; with neither, the stream starts
        at the newest event ("now"). The stream tails the durable log, so it is correct across
        several control-plane instances.
      x-weft-role: viewer
      parameters:
        - {name: graph, in: query, schema: {type: string}, description: Empty = all graphs}
        - {name: after, in: query, schema: {type: integer, format: int64}}
        - {name: node, in: query, schema: {type: string}}
        - {name: types, in: query, schema: {type: string}}
        - {name: access_token, in: query, schema: {type: string}, description: Alternative to the Authorization header (GET only)}
        - {name: Last-Event-ID, in: header, schema: {type: string}}
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: {type: string}
              example: "id: 4211\nevent: execution.completed\ndata: {\"seq\":4211,\"type\":\"execution.completed\",...}\n\n"
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: Approvals (newest first)
      x-weft-role: viewer
      parameters:
        - {name: graph, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ApprovalStatus"}}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, default: 200}
      responses:
        "200":
          description: Approvals
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Approval"}}
  /api/v1/approvals/{approvalId}/{decision}:
    parameters:
      - {name: approvalId, in: path, required: true, schema: {type: string}}
      - name: decision
        in: path
        required: true
        schema: {enum: [approve, reject]}
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Approve or reject (first decision wins)
      description: |
        `answer` is the human's reply for `question` approvals, or a replacement payload (valid JSON)
        for held `message` approvals.
      x-weft-role: operator
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: {type: string}
                answer: {type: string}
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: Configured and console-managed model providers (no secrets)
      x-weft-role: viewer
      responses:
        "200":
          description: Providers in registry order; ETag is the settings revision
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Provider"}}
    post:
      tags: [providers]
      operationId: createProvider
      summary: Create a console-managed provider (credential encrypted at rest)
      x-weft-role: admin
      parameters:
        - {$ref: "#/components/parameters/IfMatchRevision"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Provider"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidProvider"}
  /api/v1/providers/test:
    post:
      tags: [providers]
      operationId: testProviderDraft
      summary: Test unsaved provider settings (lists models, sends one short prompt); saves nothing
      x-weft-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderInput"}
      responses:
        "200":
          description: Test result (ok reflects the inference)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderTestResult"}
        "422": {$ref: "#/components/responses/InvalidProvider"}
  /api/v1/providers/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      tags: [providers]
      operationId: getProvider
      x-weft-role: viewer
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Provider"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [providers]
      operationId: updateProvider
      summary: Update a console-managed provider (omit apiKey to keep the stored credential)
      x-weft-role: admin
      parameters:
        - {$ref: "#/components/parameters/IfMatchRevision"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Provider"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidProvider"}
    delete:
      tags: [providers]
      operationId: deleteProvider
      summary: Remove a console-managed provider (refused while selected by a graph or default)
      x-weft-role: admin
      parameters:
        - {$ref: "#/components/parameters/IfMatchRevision"}
      responses:
        "204": {description: Removed}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidProvider"}
  /api/v1/providers/{name}/test:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    post:
      tags: [providers]
      operationId: testProvider
      summary: Test a saved provider through the LLM gateway
      x-weft-role: operator
      responses:
        "200":
          description: Test result (ok reflects the inference)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderTestResult"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/provider-plugins:
    get:
      tags: [providers]
      operationId: listProviderPlugins
      x-weft-role: viewer
      responses:
        "200":
          description: Installed provider plugins (manifest, capabilities) and the instances built from each
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ProviderPlugin"}
  /api/v1/provider-plugins/{id}:
    put:
      tags: [providers]
      operationId: setProviderPluginEnabled
      x-weft-role: admin
      description: >-
        Enables or disables an inference plugin. Plugins start disabled. Disabling keeps the plugin's
        instances; they report unavailable (and nodes using them fail with that reason) until it is enabled again.
        A plugin provided by server configuration cannot be disabled here.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/IfMatchRevision"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200":
          description: The plugin after the change
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderPlugin"}
        "404": {description: Unknown plugin}
        "409": {description: Stale If-Match revision}
        "422": {description: The plugin is provided by server configuration}
  /api/v1/scm/connections:
    get:
      tags: [scm]
      operationId: listSCMConnections
      x-weft-role: viewer
      responses:
        "200":
          description: Connections without credentials
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/SCMConnection"}}
    post:
      tags: [scm]
      operationId: createSCMConnection
      x-weft-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SCMConnectionInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SCMConnection"}
        "409": {description: No installation key to encrypt the token}
        "422": {description: Field-level validation errors}
  /api/v1/scm/connections/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    put:
      tags: [scm]
      operationId: updateSCMConnection
      x-weft-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SCMConnectionInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SCMConnection"}
        "404": {description: Unknown connection}
        "422": {description: Field-level validation errors}
    delete:
      tags: [scm]
      operationId: deleteSCMConnection
      x-weft-role: admin
      responses:
        "204": {description: Deleted}
        "404": {description: Unknown connection}
  /api/v1/scm/connections/{name}/test:
    post:
      tags: [scm]
      operationId: testSCMConnection
      x-weft-role: operator
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: "{ok, identity} or {ok: false, error} with the token redacted"
  /api/v1/cost/prices:
    get:
      tags: [cost]
      operationId: getPrices
      x-weft-role: viewer
      responses:
        "200":
          description: Current price catalogue (version 0 when none was saved)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceCatalogue"}
    put:
      tags: [cost]
      operationId: putPrices
      x-weft-role: admin
      parameters:
        - {$ref: "#/components/parameters/IfMatchRevision"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currency]
              properties:
                currency: {type: string, pattern: "^[A-Za-z]{3}$"}
                unpriced: {type: string, enum: [allow, refuse]}
                prices: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/Price"}}
      responses:
        "200":
          description: The new catalogue version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceCatalogue"}
        "409": {description: Stale If-Match revision}
        "422": {description: Field-level validation errors}
  /api/v1/cost/policy:
    get:
      tags: [cost]
      operationId: getCostPolicy
      x-weft-role: viewer
      responses:
        "200":
          description: Installation cost policy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CostPolicy"}
    put:
      tags: [cost]
      operationId: putCostPolicy
      x-weft-role: admin
      parameters:
        - {$ref: "#/components/parameters/IfMatchRevision"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                taskRunBudgetMicros: {type: integer, format: int64, minimum: 0, description: Budget each new task run starts with; 0 = none}
                warningPercent: {type: integer, minimum: 1, maximum: 100}
      responses:
        "200":
          description: The stored policy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CostPolicy"}
        "409": {description: Stale If-Match revision}
        "422": {description: Field-level validation errors}
  /api/v1/cost/budgets:
    get:
      tags: [cost]
      operationId: getBudgetDefinitions
      x-weft-role: viewer
      responses:
        "200":
          description: Monthly budget definitions and the current period (YYYY-MM, UTC)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BudgetDefinitions"}
    put:
      tags: [cost]
      operationId: putBudgetDefinitions
      x-weft-role: admin
      parameters:
        - {$ref: "#/components/parameters/IfMatchRevision"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                budgets: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/BudgetDefinition"}}
      responses:
        "200":
          description: The stored definitions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BudgetDefinitions"}
        "409": {description: Stale If-Match revision}
        "422": {description: Field-level validation errors}
  /api/v1/cost/budgets/preview:
    get:
      tags: [cost]
      operationId: previewBudgets
      x-weft-role: viewer
      parameters:
        - {name: workflow, in: query, schema: {type: string}}
        - {name: project, in: query, schema: {type: string}}
      responses:
        "200":
          description: Budgets a new task by the caller would be held to
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskRunBudgetMicros: {type: integer, format: int64}
                  currency: {type: string}
                  budgets: {type: array, items: {$ref: "#/components/schemas/BudgetView"}}
  /api/v1/cost/ledgers:
    get:
      tags: [cost]
      operationId: listBudgetLedgers
      x-weft-role: viewer
      parameters:
        - {name: period, in: query, schema: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$"}}
      responses:
        "200":
          description: The month's ledgers and task runs a budget refused or paused
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/BudgetView"}}
  /api/v1/cost/spend:
    get:
      tags: [cost]
      operationId: getSpend
      x-weft-role: viewer
      parameters:
        - {name: period, in: query, schema: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$"}, description: Defaults to the current UTC month}
        - {name: graph, in: query, schema: {type: string}, description: Only one graph (task run)}
      responses:
        "200":
          description: Spend report
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpendReport"}
        "422": {description: Invalid period}
  /api/v1/cost/budgets/{scope}/{budget}:
    get:
      tags: [cost]
      operationId: getBudget
      x-weft-role: viewer
      parameters:
        - {name: scope, in: path, required: true, schema: {type: string, enum: [run, installation, user, project, workflow]}}
        - {name: budget, in: path, required: true, schema: {type: string}, description: "For scope run, the task run's execution graph id; for monthly scopes, <id>@<YYYY-MM>"}
      responses:
        "200":
          description: Budget ledger view
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BudgetView"}
        "404": {description: No such budget}
  /api/v1/cost/budgets/{scope}/{budget}/raise:
    post:
      tags: [cost]
      operationId: raiseBudget
      x-weft-role: admin
      description: Audited human decision that raises a budget and resumes the run it paused.
      parameters:
        - {name: scope, in: path, required: true, schema: {type: string, enum: [run, installation, user, project, workflow]}}
        - {name: budget, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [limitMicros]
              properties:
                limitMicros: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: Budget after the raise
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BudgetView"}
        "404": {description: No such budget}
        "422": {description: The new limit is not higher}
  /api/v1/provider-settings:
    get:
      tags: [providers]
      operationId: getProviderSettings
      x-weft-role: viewer
      responses:
        "200":
          description: Settings revision, default provider, credential storage status, supported types
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderSettings"}
    put:
      tags: [providers]
      operationId: setDefaultProvider
      x-weft-role: admin
      parameters:
        - {$ref: "#/components/parameters/IfMatchRevision"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [default]
              properties:
                default: {type: string, description: Provider name; empty returns to the configuration default}
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderSettings"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidProvider"}
  /api/v1/chat/settings:
    get:
      tags: [providers]
      operationId: getChatModelSettings
      x-weft-role: viewer
      responses:
        "200":
          description: Explicit Chat model selection and local configuration status. This does not test inference.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatModelSettings"}
    put:
      tags: [providers]
      operationId: saveChatModelSettings
      x-weft-role: admin
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Chat settings revision. Use 0 for the initial selection.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatModelSelection"}
      responses:
        "200":
          description: Saved Chat model selection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatModelSettings"}
        "400": {description: Invalid selection, unavailable provider, or missing revision}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/chat/candidates:
    get:
      tags: [chat]
      operationId: listChatCandidates
      x-weft-role: viewer
      summary: Search authorized resources before composing a chat turn
      parameters:
        - {name: area, in: query, required: true, schema: {type: string, enum: [tasks, agents, workflows, projects, skills]}}
        - {name: q, in: query, schema: {type: string, maxLength: 320}}
      responses:
        "200":
          description: Bounded matching candidates. A partial result can be refined or explicitly selected.
          content:
            application/json:
              schema:
                type: object
                required: [items, partial]
                properties:
                  partial: {type: boolean}
                  items:
                    type: array
                    maxItems: 8
                    items:
                      type: object
                      required: [id, label]
                      properties:
                        id: {type: string}
                        label: {type: string}
                        task:
                          type: object
                          description: Display fields for a task match.
                          required: [title, status]
                          properties:
                            title: {type: string}
                            status: {type: string}
                            projectId: {type: string}
        "400": {description: Unsupported area or invalid query}
  /api/v1/chat/sessions:
    get:
      tags: [chat]
      operationId: listChatSessions
      x-weft-role: viewer
      parameters:
        - name: archived
          in: query
          schema: {type: boolean, default: false}
        - name: after
          in: query
          description: Cursor returned by the preceding page
          schema: {type: string}
      responses:
        "200":
          description: Recent or archived summaries within the authenticated owner scope.
          content:
            application/json:
              schema:
                type: object
                required: [shared, items, next, archivedUnread]
                properties:
                  shared: {type: boolean, description: Shared local session history in auth-disabled mode}
                  next: {type: string, description: Empty when no older page exists}
                  archivedUnread: {type: integer, description: Unread archived results for the current owner}
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, lastActivity, running, unread, unreadSuccess, unreadFailure, unreadCancellation, decisions, unknown]
                      properties:
                        id: {type: string}
                        title: {type: string}
                        lastActivity: {type: string, format: date-time}
                        running: {type: integer}
                        unread: {type: integer}
                        unreadSuccess: {type: integer}
                        unreadFailure: {type: integer}
                        unreadCancellation: {type: integer}
                        decisions: {type: integer, description: Task watches awaiting a decision plus unexpired operation reviews the current role can decide}
                        unknown: {type: integer}
    post:
      tags: [chat]
      operationId: createChatWithMessage
      x-weft-role: viewer
      requestBody: {$ref: "#/components/requestBodies/ChatMessageSubmission"}
      responses:
        "200": {$ref: "#/components/responses/ChatSession"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/chat/sessions/{chatId}:
    parameters:
      - {$ref: "#/components/parameters/ChatSessionID"}
    get:
      tags: [chat]
      operationId: getChatSession
      x-weft-role: viewer
      responses:
        "200": {$ref: "#/components/responses/ChatSession"}
        "404": {description: Session absent or inaccessible}
  /api/v1/chat/sessions/{chatId}/{action}:
    parameters:
      - {$ref: "#/components/parameters/ChatSessionID"}
      - {name: action, in: path, required: true, schema: {type: string, enum: [archive, restore]}}
    post:
      tags: [chat]
      operationId: changeChatArchiveState
      x-weft-role: viewer
      responses:
        "200": {$ref: "#/components/responses/ChatSession"}
        "404": {description: Session absent or inaccessible}
  /api/v1/chat/sessions/{chatId}/messages:
    parameters:
      - {$ref: "#/components/parameters/ChatSessionID"}
    post:
      tags: [chat]
      operationId: appendChatMessage
      x-weft-role: viewer
      requestBody: {$ref: "#/components/requestBodies/ChatMessageSubmission"}
      responses:
        "200": {$ref: "#/components/responses/ChatSession"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/chat/sessions/{chatId}/messages/{requestId}/retry:
    parameters:
      - {$ref: "#/components/parameters/ChatSessionID"}
      - {name: requestId, in: path, required: true, schema: {type: string}}
    post:
      tags: [chat]
      operationId: retryChatRequest
      x-weft-role: viewer
      responses:
        "200": {$ref: "#/components/responses/ChatSession"}
        "404": {description: Request absent or inaccessible}
        "409": {description: Restore an archived session before retrying, or wait for its pending request}
  /api/v1/chat/sessions/{chatId}/messages/{messageId}/read:
    parameters:
      - {$ref: "#/components/parameters/ChatSessionID"}
      - {name: messageId, in: path, required: true, schema: {type: string}}
    post:
      tags: [chat]
      operationId: markChatResultRead
      x-weft-role: viewer
      responses:
        "200": {$ref: "#/components/responses/ChatSession"}
  /api/v1/chat/sessions/{chatId}/title:
    parameters:
      - {$ref: "#/components/parameters/ChatSessionID"}
    put:
      tags: [chat]
      operationId: renameChat
      x-weft-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, previousTitle]
              additionalProperties: false
              properties:
                title: {type: string, minLength: 1, maxLength: 120, description: Safe single-line title of up to 120 UTF-8 bytes}
                previousTitle: {type: string}
      responses:
        "200": {$ref: "#/components/responses/ChatSession"}
        "400": {description: Invalid title or request}
        "404": {description: Session absent or inaccessible}
        "409": {description: Title changed since the editor opened}
  /api/v1/chat/sessions/{chatId}/title/retry:
    parameters:
      - {$ref: "#/components/parameters/ChatSessionID"}
    post:
      tags: [chat]
      operationId: retryChatTitle
      x-weft-role: viewer
      responses:
        "200": {$ref: "#/components/responses/ChatSession"}
        "404": {description: Session absent or inaccessible}
        "409": {description: Title is ineligible for retry or the Chat model is unavailable}
  /api/v1/chat/sessions/{chatId}/operations/{operationId}/pr-diff:
    parameters:
      - {$ref: "#/components/parameters/ChatSessionID"}
      - {name: operationId, in: path, required: true, schema: {type: string}}
    get:
      tags: [chat]
      operationId: inspectChatPRDiff
      x-weft-role: operator
      description: Read the bounded diff for an owned analysis review under the current saved SCM read grant. This does not start analysis, publish anything or persist the diff in the conversation.
      responses:
        "200":
          description: Pinned diff, with response caching disabled
          content:
            application/json:
              schema:
                type: object
                required: [head, base, diff]
                properties:
                  head: {type: string}
                  base: {type: string}
                  diff: {type: string, description: Unified diff or structured provider diff serialized as text}
        "403": {description: Operator access required}
        "404": {description: Review absent or inaccessible}
        "409": {description: Pinned revision, grant or bounded diff no longer available}
  /api/v1/chat/sessions/{chatId}/operations/{operationId}/pr-comment-review:
    parameters:
      - {$ref: "#/components/parameters/ChatSessionID"}
      - {name: operationId, in: path, required: true, schema: {type: string}}
    post:
      tags: [chat]
      operationId: prepareChatPRComments
      x-weft-role: operator
      description: Review selected line comments from an owned completed analysis. No provider write until the separately bound confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [commentIds]
              properties:
                commentIds: {type: array, uniqueItems: true, minItems: 1, maxItems: 6, items: {type: integer, minimum: 1}}
      responses:
        "200": {$ref: "#/components/responses/ChatSession"}
        "400": {description: Invalid or unresolved selection}
        "403": {description: Current role or explicit repository grants are insufficient}
        "404": {description: Analysis absent or inaccessible}
        "409": {description: Provider, immutable diff anchor or reviewed revision unavailable}
  /api/v1/chat/sessions/{chatId}/operations/{operationId}/pr-comment-receipts:
    parameters:
      - {$ref: "#/components/parameters/ChatSessionID"}
      - {name: operationId, in: path, required: true, schema: {type: string}}
    post:
      tags: [chat]
      operationId: reconcileChatPRComments
      x-weft-role: operator
      description: Look up uncertain publication receipts using the original scoped connection and source revision. Never attempts or resends a comment.
      responses:
        "200": {$ref: "#/components/responses/ChatSession"}
        "403": {description: Current role or explicit repository grants are insufficient}
        "404": {description: Review absent or inaccessible}
        "409": {description: Publication has not settled}
  /api/v1/chat/sessions/{chatId}/operations/{operationId}/{decision}:
    parameters:
      - {$ref: "#/components/parameters/ChatSessionID"}
      - {name: operationId, in: path, required: true, schema: {type: string}}
      - {name: decision, in: path, required: true, schema: {type: string, enum: [confirm, decline]}}
    post:
      tags: [chat]
      operationId: decideChatReview
      x-weft-role: operator
      description: Decision requires session ownership and the current role for the reviewed operation. Task drafting and retry, PR analysis and line comment publication, eligible approvals, live guidance and runtime controls require operator. Task start and cancellation, catalog and workflow edits and installation configuration require admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [digest]
              properties:
                digest: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        "200": {$ref: "#/components/responses/ChatSession"}
        "403": {description: Current role cannot decide the reviewed operation}
        "404": {description: Review absent or inaccessible}
        "409": {description: Review digest mismatch or confirmation expired}
  /api/v1/providers/{name}/models:
    get:
      tags: [catalog]
      operationId: listModels
      x-weft-role: viewer
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Models the backend reports (best effort)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    provider: {type: string}
                    contextSize: {type: integer}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/tools:
    get:
      tags: [catalog]
      operationId: listTools
      x-weft-role: viewer
      responses:
        "200":
          description: Registered tools
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    capability: {type: string}
                    description: {type: string}
                    schema: {type: object}
  /api/v1/graphs/{id}/files:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    get:
      tags: [workspace]
      operationId: listFiles
      summary: List a workspace directory (worktree of node/replica when it has one)
      x-weft-role: viewer
      parameters:
        - {name: path, in: query, schema: {type: string}}
        - {name: node, in: query, schema: {type: string}}
        - {name: replica, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Entries (max 2000, .git hidden)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    path: {type: string}
                    dir: {type: boolean}
                    size: {type: integer}
                    modTime: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/graphs/{id}/files/content:
    parameters: [{$ref: "#/components/parameters/GraphId"}]
    get:
      tags: [workspace]
      operationId: getFileContent
      summary: Read a workspace file (first 4 MiB, always text/plain with a deny-all CSP)
      x-weft-role: viewer
      parameters:
        - {name: path, in: query, required: true, schema: {type: string}}
        - {name: node, in: query, schema: {type: string}}
        - {name: replica, in: query, schema: {type: integer}}
      responses:
        "200":
          description: File bytes
          content:
            text/plain: {schema: {type: string}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/graphs/{id}/nodes/{node}/replicas/{replica}/git/publish:
    parameters:
      - {$ref: "#/components/parameters/GraphId"}
      - {$ref: "#/components/parameters/NodeId"}
      - {name: replica, in: path, required: true, schema: {type: integer, minimum: 0}}
    post:
      tags: [workspace]
      operationId: publishReplicaBranch
      summary: Publish a reviewed private replica commit to its assigned local graph branch
      x-weft-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [commit, previous]
              properties:
                commit: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
                previous: {type: string, pattern: '^([0-9a-f]{40}([0-9a-f]{24})?)?$', description: 'Expected destination commit in the same object format, or empty for creation.'}
      responses:
        "200":
          description: The destination branch now points at the requested commit, including after a retry.
          content:
            application/json:
              schema:
                type: object
                required: [branch, commit]
                properties:
                  branch: {type: string}
                  commit: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/graphs/{id}/git/{view}:
    parameters:
      - {$ref: "#/components/parameters/GraphId"}
      - {name: view, in: path, required: true, schema: {type: string, enum: [status, diff, history]}}
    get:
      tags: [workspace]
      operationId: inspectWorkspaceGit
      summary: Inspect live workspace Git state without modifying it
      description: >-
        Diff compares tracked files with HEAD; history returns at most 50 commits.
        Optional path is literal and relative. Node must identify a worktree-mode
        agent; replica requires node. Inspection never creates workspaces.
        Output is limited to 4 MiB per command and inspection to 10 seconds.
        Unsupported configuration, metadata redirection and oversized metadata
        fail explicitly. Recent execution context does not prove change authorship.
      x-weft-role: viewer
      parameters:
        - {name: path, in: query, schema: {type: string}}
        - {name: node, in: query, schema: {type: string}}
        - {name: replica, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: Live inspection; repository is false for a non-repository directory
          content:
            application/json:
              schema:
                type: object
                required: [repository, directory, branch, content, attribution, graphId]
                properties:
                  repository: {type: boolean}
                  directory: {type: string}
                  branch: {type: string}
                  content: {type: string}
                  attribution: {type: string, enum: [inconclusive]}
                  graphId: {type: string}
                  nodeId: {type: string}
                  replica: {type: integer, minimum: 0}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {description: Inspection failed; never returned as an empty successful diff}
  # ---------------------------------------------------------------- callbacks
  /internal/v1/executions/{executionId}/tools:
    parameters: [{$ref: "#/components/parameters/ExecutionId"}]
    get:
      tags: [runtime-callback]
      operationId: cbListTools
      security: [{executionToken: []}]
      responses:
        "200":
          description: Granted tools only
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ToolSchema"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /internal/v1/executions/{executionId}/tools/{tool}:
    parameters:
      - $ref: "#/components/parameters/ExecutionId"
      - {name: tool, in: path, required: true, schema: {type: string}, example: filesystem.read}
    post:
      tags: [runtime-callback]
      operationId: cbInvokeTool
      summary: Invoke a tool under the node's grants
      description: "Execution failures (and budget exhaustion, invalid arguments) return 200 with `isError` set to true."
      security: [{executionToken: []}]
      requestBody:
        content:
          application/json:
            schema: {type: object, description: Tool arguments (see GET /api/v1/tools)}
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ToolResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429":
          description: Grant rate limit exceeded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /internal/v1/executions/{executionId}/llm/chat:
    parameters: [{$ref: "#/components/parameters/ExecutionId"}]
    post:
      tags: [runtime-callback]
      operationId: cbChat
      summary: Call the node's model (model defaults to the node's; provider keys stay server-side)
      security: [{executionToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatRequest"}
      responses:
        "200":
          description: Completion
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "502":
          description: Provider error or token budget exhausted (code `llm_error`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /internal/v1/executions/{executionId}/emit:
    parameters: [{$ref: "#/components/parameters/ExecutionId"}]
    post:
      tags: [runtime-callback]
      operationId: cbEmit
      summary: Queue an output message (published only if the turn succeeds)
      security: [{executionToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Emit"}
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema: {type: object, properties: {queued: {const: true}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /internal/v1/executions/{executionId}/state/{key}:
    parameters:
      - $ref: "#/components/parameters/ExecutionId"
      - {name: key, in: path, required: true, schema: {type: string, maxLength: 512}, description: URL-encoded; may contain '/'}
    get:
      tags: [runtime-callback]
      operationId: cbStateGet
      summary: Read node memory (shared by all replicas of the node)
      security: [{executionToken: []}]
      responses:
        "200":
          description: Raw bytes
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [runtime-callback]
      operationId: cbStatePut
      security: [{executionToken: []}]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, maxLength: 1048576}
      responses:
        "204": {description: Stored}
        "400": {$ref: "#/components/responses/BadRequest"}
  /internal/v1/executions/{executionId}/output:
    parameters: [{$ref: "#/components/parameters/ExecutionId"}]
    post:
      tags: [runtime-callback]
      operationId: cbOutput
      summary: Stream narration to observers (event agent.output, max 8000 chars kept)
      security: [{executionToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [text], properties: {text: {type: string}}}
      responses:
        "204": {description: Recorded}
  /internal/v1/executions/{executionId}/ask:
    parameters: [{$ref: "#/components/parameters/ExecutionId"}]
    post:
      tags: [runtime-callback]
      operationId: cbAsk
      summary: Ask a human; blocks until answered (question approval)
      security: [{executionToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [question], properties: {question: {type: string}}}
      responses:
        "200":
          description: Answer
          content:
            application/json:
              schema: {type: object, properties: {answer: {type: string}}}
        "409":
          description: Rejected or expired (code `no_answer`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/mcp/history:
    get:
      tags: [mcp]
      operationId: getMCPHistory
      summary: Filter safe persisted MCP tool and approval outcomes
      x-weft-role: viewer
      description: Newest first; at most 500 eligible events scanned per page. An empty page can still have hasMore. No raw arguments, responses, comments or upstream errors.
      parameters:
        - in: query
          name: connection
          schema: {type: string}
        - in: query
          name: graph
          schema: {type: string}
        - in: query
          name: node
          schema: {type: string}
        - in: query
          name: tool
          schema: {type: string}
        - in: query
          name: type
          schema: {type: string, enum: [tool.invoked, tool.completed, tool.denied, approval.requested, approval.decided]}
        - in: query
          name: outcome
          schema: {type: string, enum: [started, ok, error, denied, unknown, rate_limited, rejected, pending, approved, expired]}
        - in: query
          name: since
          schema: {type: string, format: date-time}
        - in: query
          name: until
          schema: {type: string, format: date-time}
        - in: query
          name: before
          schema: {type: integer, minimum: 0}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Safe page; continue using before=nextBefore while hasMore is true
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPHistoryPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "422":
          description: Invalid filter bounds or enum
  /api/v1/mcp/connections:
    get:
      tags: [mcp]
      operationId: listMCPConnections
      summary: List safe MCP connection metadata
      x-weft-role: viewer
      responses:
        "200":
          description: Safe metadata; discovery attempts may report unavailable. No invocation is performed.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MCPConnection"}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422":
          description: Invalid connection or MCP grant
    post:
      tags: [mcp]
      operationId: createMCPConnection
      summary: Register a remote MCP connection
      x-weft-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MCPConnectionInput"}
      responses:
        "201":
          description: Safe metadata; discovery attempts may report unavailable. No invocation is performed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPConnection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422":
          description: Invalid connection or MCP grant
  /api/v1/mcp/connections/{connection}:
    get:
      tags: [mcp]
      operationId: getMCPConnection
      summary: Read a safe MCP connection
      x-weft-role: viewer
      parameters:
        - in: path
          name: connection
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Safe metadata; discovery attempts may report unavailable. No invocation is performed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPConnection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422":
          description: Invalid connection or MCP grant
    put:
      tags: [mcp]
      operationId: updateMCPConnection
      summary: Update a connection with a required current revision
      x-weft-role: admin
      parameters:
        - in: path
          name: connection
          required: true
          schema: {type: string}
        - in: header
          name: If-Match
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MCPConnectionInput"}
      responses:
        "200":
          description: Safe metadata; discovery attempts may report unavailable. No invocation is performed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPConnection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422":
          description: Invalid connection or MCP grant
    delete:
      tags: [mcp]
      operationId: deleteMCPConnection
      summary: Remove disabled local connection and permanently reserve its ID
      description: Requires prior OAuth revocation when configured. Removes local credentials and catalogue; preserves audit history and obsolete graph references. Does not delete remote applications or registrations or roll back dispatched calls.
      x-weft-role: admin
      parameters:
        - in: path
          name: connection
          required: true
          schema: {type: string}
        - in: header
          name: If-Match
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "204":
          description: Local connection deleted; ID permanently reserved
        "400": {$ref: "#/components/responses/BadRequest"}
        "403":
          description: Administrator role required
        "404":
          description: Connection not found or already deleted
        "409": {$ref: "#/components/responses/Conflict"}
        "422":
          description: Disable the connection and complete local OAuth revocation first
  /api/v1/mcp/connections/{connection}/test:
    post:
      tags: [mcp]
      operationId: testMCPConnection
      summary: Test and refresh the discovered catalogue
      x-weft-role: operator
      parameters:
        - in: path
          name: connection
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Safe metadata; discovery attempts may report unavailable. No invocation is performed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPConnection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422":
          description: Invalid connection or MCP grant
  /api/v1/mcp/connections/{connection}/tools/refresh:
    post:
      tags: [mcp]
      operationId: refreshMCPTools
      summary: Discover and persist the MCP tool catalogue
      x-weft-role: operator
      parameters:
        - in: path
          name: connection
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Safe metadata; discovery attempts may report unavailable. No invocation is performed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPConnection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422":
          description: Invalid connection or MCP grant
  /api/v1/mcp/tools:
    get:
      tags: [mcp]
      operationId: listMCPPermissionTools
      summary: List currently available MCP tools for explicit agent grants
      x-weft-role: viewer
      responses:
        "200":
          description: Safe metadata; discovery attempts may report unavailable. No invocation is performed.
          content:
            application/json:
              schema: {type: array, items: {type: object}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422":
          description: Invalid connection or MCP grant

  /api/v1/tasks/{tid}/authorization:
    parameters:
      - {name: tid, in: path, required: true, schema: {type: string}}
    get:
      summary: Review current task consent and capability scope
      x-weft-role: viewer
      responses:
        '200': {description: Scope digest, reviewed capabilities and optional consent record}
    put:
      summary: Confirm draft consent or reduce running task authorization (admin only)
      x-weft-role: admin
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: integer, minimum: 0}, description: Consent revision; zero creates the initial record}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode, scope, confirm]
              properties:
                mode: {type: string, enum: [ask, workspace, full]}
                remember: {type: boolean, default: false, description: Save a project suggestion; never automatic consent}
                preferenceRevision: {type: integer, minimum: 0}
                scope: {type: string}
                confirm: {type: boolean, enum: [true]}
      responses:
        '200': {description: Persisted consent; grants and mandatory gates unchanged}
        '400': {description: Invalid confirmation or unsupported native workspace confinement}
        '403': {description: Administrator required}
        '409': {description: Stale task scope or consent revision}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Static API token (role from config) or OIDC JWT (RS256/ES256, role claim `weft_role` by default).
    executionToken:
      type: http
      scheme: bearer
      description: Per-execution token from TurnInput.callback.token; valid only while that turn runs.
  parameters:
    ChatSessionID:
      name: chatId
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
    GraphId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"}
    NodeId:
      name: node
      in: path
      required: true
      schema: {type: string}
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, default: 100}
    IfMatchRevision:
      name: If-Match
      in: header
      required: false
      description: Provider settings revision the caller edited; a stale value returns 409.
      schema: {type: string}
  requestBodies:
    GraphDocument:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Graph"}
        application/yaml:
          schema: {$ref: "#/components/schemas/Graph"}
          example: |
            apiVersion: weft.io/v1
            kind: Graph
            metadata: {name: hello}
            spec:
              defaults: {runtime: {kind: echo}}
              nodes: [{id: a}, {id: b}]
              channels: [{id: in, to: [a]}, {id: ab, from: a, to: [b]}]
    ChatMessageSubmission:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [requestId, text]
            properties:
              requestId: {type: string, pattern: '^[0-9a-f]{32}$'}
              text: {type: string, minLength: 1, description: Up to 4096 UTF-8 bytes. Credentials are rejected.}
  responses:
    ChatSession:
      description: Owned conversation with messages, request states and task watches.
      content:
        application/json:
          schema:
            type: object
            required: [id, archived, lastActivity, messages]
            properties:
              id: {type: string}
              title: {type: string}
              titleRetryState: {type: string, enum: [pending, completed, failed]}
              titleRetryStarted: {type: string, format: date-time}
              archived: {type: boolean}
              lastActivity: {type: string, format: date-time}
              messages:
                type: array
                items: {$ref: "#/components/schemas/ChatTranscriptMessage"}
              watches:
                type: array
                items: {type: object}
    AgentEntry:
      description: Reusable agent and its immutable versions
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AgentEntry"}
    BadRequest:
      description: Malformed request (code `invalid`)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing or invalid credentials (code `unauthorized`)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: Role too low, or tool denied/rejected (code `forbidden`)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Not found (code `not_found`)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Version conflict, already exists, wrong state, or approval already decided (code `conflict`)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Invalid:
      description: Graph failed validation; `details` holds the report (code `invalid`)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidProvider:
      description: Provider input failed validation; `details.errors[]` holds `{path, message}` (code `invalid`)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    ChatTranscriptMessage:
      type: object
      required: [id, role, text, createdAt]
      properties:
        id: {type: string}
        role: {type: string, enum: [user, assistant]}
        text: {type: string}
        state: {type: string, enum: [pending, interpreting, interpreted, unavailable, clarification, discovery, grounded]}
        createdAt: {type: string, format: date-time}
        attempt: {type: string, format: date-time}
        unread: {type: boolean}
        inventory:
          type: object
          required: [area, items]
          properties:
            area: {enum: [tasks, workflows, agents, projects]}
            taskMode: {type: string, enum: [list, count, exists], description: Mode selected by the model for a task query.}
            taskStatus: {type: string, description: Task lifecycle filter used by the query.}
            total: {type: integer, minimum: 0, description: Total matching tasks before the display limit.}
            items:
              type: array
              maxItems: 8
              items:
                type: object
                required: [position, id]
                properties:
                  position: {type: integer, minimum: 1, maximum: 8}
                  id: {type: string}
        execution:
          type: object
          required: [id, root, graph, state, nodes, active, cancellationRequested]
          properties:
            id: {type: string}
            root: {type: string}
            graph: {type: string}
            state: {type: string}
            nodes: {type: integer}
            active: {type: integer}
            cancellationRequested: {type: boolean}
        destination: {type: string, enum: [tasks, workflows, agents, projects, activity, approvals, models, chat-model, plugins, usage, budgets, prices, connections, connection-setup, skills, administration, configuration-export, delegation, network, retention, resources, tools, task-editor, project-import, source-control-setup], description: "Read-only console destination or authenticated download."}
        review:
          oneOf:
            - {$ref: "#/components/schemas/ChatAgentReview"}
            - {$ref: "#/components/schemas/ChatWorkflowReview"}
            - {$ref: "#/components/schemas/ChatTaskDraftReview"}
            - {$ref: "#/components/schemas/ChatTaskStartReview"}
            - {$ref: "#/components/schemas/ChatWorkflowControlReview"}
            - {$ref: "#/components/schemas/ChatExecutionCancelReview"}
            - {$ref: "#/components/schemas/ChatWorkflowScaleReview"}
            - {$ref: "#/components/schemas/ChatTriggerReview"}
            - {$ref: "#/components/schemas/ChatTaskRetryReview"}
            - {$ref: "#/components/schemas/ChatCorrectionReview"}
            - {$ref: "#/components/schemas/ChatEnvironmentReview"}
            - {$ref: "#/components/schemas/ChatWorkflowEnvironmentReview"}
            - {$ref: "#/components/schemas/ChatCatalogPublicationReview"}
            - {$ref: "#/components/schemas/ChatAgentAdoptionReview"}
            - {$ref: "#/components/schemas/ChatApprovalReview"}
            - {$ref: "#/components/schemas/ChatTaskCancellationReview"}
            - {$ref: "#/components/schemas/ChatTaskAuthorizationReview"}
            - {$ref: "#/components/schemas/ChatBudgetRaiseReview"}
            - {$ref: "#/components/schemas/ChatConfigurationReview"}
            - {$ref: "#/components/schemas/ChatGuidanceReview"}
            - {$ref: "#/components/schemas/ChatInstructionReview"}
            - {$ref: "#/components/schemas/ChatPRReview"}
            - {$ref: "#/components/schemas/ChatPRPublicationReview"}
            - {$ref: "#/components/schemas/ChatSkillReview"}
        task:
          type: object
          required: [id, state]
          properties:
            id: {type: string}
            state: {type: string}
            linkOnly: {type: boolean, description: A verified task reference for opening its details without a runtime snapshot. State is empty for this reference.}
            graphId: {type: string}
            executionId: {type: string}
            decisionNeeded: {type: boolean}
            settledBlock: {type: boolean}
            retryOf: {type: string}
            otherRepositories: {type: integer, minimum: 0}
            repositories:
              type: array
              items:
                type: object
                required: [project, base, preparation]
                properties:
                  alias: {type: string}
                  project: {type: string}
                  base: {type: string}
                  preparation: {type: string}
                  delivery: {type: string}
                  pullRequest: {type: integer, minimum: 1}
    ChatAgentReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [agentId, definition, modelRevision]
          properties:
            agentId: {type: string}
            definition: {$ref: "#/components/schemas/AgentDefinition"}
            modelRevision: {type: integer}
    ChatConfigurationReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [configuration]
          properties:
            configuration:
              type: object
              required: [document, objects]
              properties:
                document: {type: string, maxLength: 4096}
                intakeConsent: {type: boolean}
                objects:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    required: [key, action, revision, changes]
                    properties:
                      key: {type: string}
                      action: {type: string}
                      revision: {type: string}
                      consent: {type: string}
                      warning: {type: string}
                      changes: {type: array, items: {type: object}}
            configReceipts:
              type: array
              items:
                type: object
                required: [key, result]
                properties:
                  key: {type: string}
                  result: {type: string, enum: [applied, unchanged, failed, not-applied, saved-revision-unknown]}
                  revision: {type: string}
    ChatSkillText:
      type: object
      required: [id, title, body, description, enabled, global]
      properties:
        id: {type: string}
        title: {type: string}
        body: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        global: {type: boolean}
    ChatSkillReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [skill]
          properties:
            skill:
              type: object
              required: [revision, after]
              properties:
                delete: {type: boolean, description: "Save a deletion revision after checking workflow references."}
                revision: {type: integer, minimum: 0}
                before: {$ref: "#/components/schemas/ChatSkillText"}
                after: {$ref: "#/components/schemas/ChatSkillText"}
    ChatPRReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [pr]
          properties:
            prSummary: {type: string, description: "Bounded draft from the correlated execution."}
            pr: {$ref: "#/components/schemas/ChatPRAnalysis"}
            prComments: {type: array, maxItems: 6, items: {$ref: "#/components/schemas/ChatPRDraftComment"}}
    ChatPRAnalysis:
      type: object
      required: [number, provider, repository, connection, connectionRevision, head, base, headRef, baseRef, graph, node, channel, version, run, modelProvider, modelName]
      properties:
        number: {type: integer}
        provider: {type: string}
        repository: {type: string}
        connection: {type: string}
        connectionRevision: {type: string}
        head: {type: string}
        base: {type: string}
        headRef: {type: string}
        baseRef: {type: string}
        draft: {type: boolean}
        graph: {type: string}
        node: {type: string}
        channel: {type: string}
        version: {type: integer}
        run: {type: string}
        modelProvider: {type: string}
        modelName: {type: string}
    ChatPRDraftComment:
      type: object
      required: [id, path, side, line, body]
      properties:
        id: {type: integer, minimum: 1}
        path: {type: string}
        side: {type: string, enum: [LEFT, RIGHT]}
        line: {type: integer, minimum: 1}
        body: {type: string, maxLength: 480}
    ChatPRPublicationReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [prPublication]
          properties:
            prPublication:
              type: object
              required: [analysis, analysisId, executionId, comments]
              properties:
                analysis: {$ref: "#/components/schemas/ChatPRAnalysis"}
                analysisId: {type: string}
                executionId: {type: string}
                comments: {type: array, minItems: 1, maxItems: 6, items: {$ref: "#/components/schemas/ChatPRDraftComment"}}
            prReceipts:
              type: array
              maxItems: 6
              description: Receipt per selected comment in the reviewed order
              items:
                type: object
                required: [state]
                properties:
                  state: {type: string, enum: [published, failed, unknown]}
                  id: {type: integer, format: int64}
                  code: {type: string}
    ChatInstructionReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [instructions]
          properties:
            instructions:
              type: object
              required: [graph, node, version, before, after, sourceDigest]
              properties:
                graph: {type: string}
                node: {type: string}
                version: {type: integer, minimum: 1}
                before: {type: string}
                after: {type: string}
                sourceDigest: {type: string}
                catalogId: {type: string}
                catalogVersion: {type: integer}
    ChatGuidanceReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [guidance]
          properties:
            guidance:
              type: object
              required: [graph, node, replica, text, run, version]
              properties:
                graph: {type: string}
                node: {type: string}
                replica: {type: string, pattern: '^(any|0|[1-9][0-9]*)$'}
                text: {type: string, maxLength: 2000}
                run: {type: string}
                version: {type: integer, minimum: 1}
            consumedAt: {type: string, format: date-time}
    ChatWorkflowReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [workflow]
          properties:
            workflow:
              type: object
              required: [graph, agentName, runtime, readOnly]
              properties:
                graph: {$ref: "#/components/schemas/Graph"}
                agentName: {type: string}
                runtime: {type: string}
                readOnly: {type: boolean}
                toolNames:
                  type: array
                  items: {type: string}
    ChatTaskDraftReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [taskDraft]
          properties:
            taskDraft:
              type: object
              required: [input, workflowRevision]
              properties:
                repositories:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    required: [alias, project, commit, revision]
                    properties:
                      alias: {type: string}
                      project: {type: string}
                      commit: {type: string}
                      revision: {type: integer}
                workflowRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
                input:
                  type: object
                  required: [title, request, outcome, graphId, graphVersion, nodeId, resultNodeId]
                  properties:
                    title: {type: string}
                    request: {type: string}
                    outcome: {type: string, enum: [understand, implement, investigate, review, freeform]}
                    graphId: {type: string}
                    graphVersion: {type: integer, minimum: 1}
                    nodeId: {type: string}
                    resultNodeId: {type: string}
                    channelId: {type: string}
                    messageType: {type: string}
                    payloadJson: {type: string}
    ChatTaskStartReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [taskStart]
          properties:
            taskStart:
              type: object
              required: [id, title, workflowId, workflowVersion, taskRevision, consent, agentGrants]
              properties:
                id: {type: string}
                title: {type: string}
                workflowId: {type: string}
                workflowVersion: {type: integer, minimum: 1}
                taskRevision: {type: integer, minimum: 1}
                consent:
                  type: object
                  required: [scope, mode, revision]
                  properties:
                    scope: {type: string}
                    mode: {type: string, enum: [ask, workspace, full]}
                    revision: {type: integer, minimum: 0}
                build:
                  type: object
                  required: [graph, hash, completed]
                  properties:
                    graph: {type: string}
                    hash: {type: string}
                    completed: {type: string, format: date-time}
                repositories:
                  type: array
                  items:
                    type: object
                    required: [project, commit, revision]
                    properties:
                      project: {type: string}
                      alias: {type: string}
                      commit: {type: string}
                      revision: {type: integer, minimum: 1}
                      checks: {type: array, items: {type: string}}
                issueSource: {type: string}
                agentGrants:
                  type: array
                  items:
                    type: object
                    required: [id, isolation]
                    properties:
                      id: {type: string}
                      isolation: {type: string}
                      tools: {type: array, items: {type: string}}
                      constraints: {type: array, items: {type: string}}
    ChatWorkflowControlReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [workflowControl]
          properties:
            workflowControl:
              type: object
              required: [action, scope]
              properties:
                action: {type: string, enum: [start, pause, resume, stop, kill]}
                scope:
                  type: object
                  required: [workflowId, version, runId, createdAt, desiredState]
                  properties:
                    workflowId: {type: string}
                    nodeId: {type: string}
                    version: {type: integer, minimum: 1}
                    runId: {type: string}
                    createdAt: {type: string, format: date-time}
                    desiredState: {type: string}
                    stoppedAndIdle: {type: boolean}
                    nodePaused: {type: boolean}
                    nodeStopped: {type: boolean}
                    nodeDisabled: {type: boolean}
                    replicaOverride: {type: integer}
            controlResult:
              type: object
              required: [runId, desired, observed, settled]
              properties:
                runId: {type: string}
                desired: {type: string}
                observed: {type: string}
                settled: {type: boolean}
                incomplete: {type: boolean}
    ChatExecutionCancelReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [executionCancel]
          properties:
            executionCancel:
              type: object
              required: [selected, root, graph, run, mode]
              properties:
                selected: {type: string}
                root: {type: string}
                graph: {type: string}
                run: {type: string}
                mode: {enum: [tree, child]}
    ChatWorkflowScaleReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
          required: [workflowScale]
          properties:
            workflowScale:
              type: object
              required: [scope, size]
              properties:
                size: {type: integer, minimum: 0, maximum: 256}
                scope:
                  type: object
                  required: [workflowId, nodeId, version, runId, createdAt, desiredState, autoscale, minimum, current]
                  properties:
                    workflowId: {type: string}
                    nodeId: {type: string}
                    version: {type: integer, minimum: 1}
                    runId: {type: string}
                    createdAt: {type: string, format: date-time}
                    desiredState: {type: string}
                    stoppedAndIdle: {type: boolean}
                    nodePaused: {type: boolean}
                    nodeStopped: {type: boolean}
                    nodeDisabled: {type: boolean}
                    replicaOverride: {type: integer}
                    autoscale: {type: boolean}
                    minimum: {type: integer, minimum: 0}
                    current: {type: integer, minimum: 0}
            scaleResult:
              type: object
              required: [version, activeReplicas, state]
              properties:
                version: {type: integer, minimum: 1}
                activeReplicas: {type: integer, minimum: 0}
                state: {type: string, enum: [converging, saved, observed, failed, superseded]}
    ChatTriggerReview:
      allOf:
        - {$ref: "#/components/schemas/ChatReviewState"}
        - type: object
