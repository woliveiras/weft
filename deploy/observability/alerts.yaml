groups:
  - name: weft
    rules:
      - alert: WeftDeadLetters
        expr: increase(weft_messages_consumed_total{outcome="dead"}[10m]) > 0
        labels: {severity: warning}
        annotations: {summary: "Messages dead-lettered on {{ $labels.graph }}/{{ $labels.node }}"}
      - alert: WeftBacklogGrowing
        expr: sum by (graph, channel) (weft_queue_pending) > 100 and deriv(sum by (graph, channel) (weft_queue_pending)[15m:1m]) > 0
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Backlog on {{ $labels.graph }}/{{ $labels.channel }} keeps growing"}
      - alert: WeftTurnFailureRate
        expr: sum by (graph, node) (rate(weft_executions_total{status="failed"}[10m])) / clamp_min(sum by (graph, node) (rate(weft_executions_total[10m])), 1e-9) > 0.25
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "More than 25% of turns fail on {{ $labels.graph }}/{{ $labels.node }}"}
      - alert: WeftApprovalsWaiting
        expr: weft_approvals_pending > 0
        for: 1h
        labels: {severity: info}
        annotations: {summary: "{{ $value }} approvals waiting for a human for over an hour"}
      - alert: WeftLLMErrors
        expr: sum by (provider) (rate(weft_llm_requests_total{outcome!="ok"}[5m])) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "LLM provider {{ $labels.provider }} is failing"}
      - alert: WeftWorkspaceJournalVolumeLow
        expr: |
          weft_workspace_journal_volume_available_bytes < 2 * weft_workspace_journal_segment_limit_bytes
          or weft_workspace_journal_volume_available_bytes / weft_workspace_journal_volume_size_bytes < 0.10
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Workspace journal filesystem has low free space"
      - alert: WeftWorkspaceJournalArchiveGrowth
        expr: |
          (weft_workspace_journal_archived_bytes - min_over_time(weft_workspace_journal_archived_bytes[1h]) > 2 * weft_workspace_journal_segment_limit_bytes)
          and weft_workspace_journal_volume_available_bytes < 24 * (weft_workspace_journal_archived_bytes - min_over_time(weft_workspace_journal_archived_bytes[1h]))
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Workspace journal archive growth threatens filesystem capacity"
      - alert: WeftWorkspaceJournalWriteFailed
        expr: |
          weft_workspace_journal_collector_failure_timestamp_seconds > 0
          and time() - weft_workspace_journal_collector_failure_timestamp_seconds < 300
        labels: {severity: critical}
        annotations:
          summary: "Workspace journal {{ $labels.operation }} failed"
      - alert: WeftWorkspaceJournalCollectorUnavailable
        expr: |
          weft_workspace_journal_collector_heartbeat_timestamp_seconds == 0
          or time() - weft_workspace_journal_collector_heartbeat_timestamp_seconds > 45
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "Workspace journal collector heartbeat is missing or stale"
      - alert: WeftWorkspaceJournalMonitoringUnavailable
        expr: |
          up{job="weft"} == 0
          or absent(up{job="weft"})
          or weft_workspace_journal_filesystem_metrics_ok == 0
          or (weft_workspace_journal_segment_limit_bytes > 0 unless weft_workspace_journal_collector_heartbeat_timestamp_seconds)
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Workspace journal monitoring is unavailable"
