apiVersion: v1
kind: Namespace
metadata:
  name: weft-sandboxes
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: sandbox, namespace: weft-sandboxes}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: replica-sandboxes, namespace: weft-sandboxes}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: replica-sandboxes, namespace: weft-sandboxes}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: replica-sandboxes}
subjects:
  - {kind: ServiceAccount, name: weftd, namespace: weft}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: sandbox-isolation, namespace: weft-sandboxes}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: sandbox-capacity, namespace: weft-sandboxes}
spec:
  hard:
    count/pods: "32"
    limits.cpu: "8"
    limits.memory: 8Gi
    limits.ephemeral-storage: 16Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: weft-workspaces, namespace: weft-sandboxes}
spec:
  # Prebind to a second static PV exported by the SAME shared filesystem.
  # An independently provisioned blank claim cannot serve controller workspaces.
  volumeName: weft-sandbox-workspaces
  storageClassName: ""
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 50Gi}}
