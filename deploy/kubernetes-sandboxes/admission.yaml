apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: weft-replica-sandbox}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: pod
      expression: object.spec
    - name: c
      expression: object.spec.containers[0]
  validations:
    - expression: >-
        variables.pod.serviceAccountName == 'sandbox' &&
        variables.pod.automountServiceAccountToken == false &&
        variables.pod.enableServiceLinks == false &&
        variables.pod.restartPolicy == 'Never' &&
        has(variables.pod.activeDeadlineSeconds) && variables.pod.activeDeadlineSeconds <= 3600 &&
        object.metadata.labels['weft.io/sandbox'] == 'true' &&
        !has(variables.pod.nodeName) && !has(variables.pod.priorityClassName)
      message: Sandbox identity, lifetime and scheduling must match the installation policy.
    - expression: >-
        variables.pod.containers.size() == 1 &&
        !has(variables.pod.initContainers) && !has(variables.pod.ephemeralContainers) &&
        !has(variables.pod.imagePullSecrets) &&
        variables.c.name == 'sandbox' && variables.c.image == 'weft/sandbox-go:dev' &&
        variables.c.command == ['sleep','infinity'] && !has(variables.c.args) &&
        !has(variables.c.lifecycle) && !has(variables.c.livenessProbe) &&
        !has(variables.c.readinessProbe) && !has(variables.c.startupProbe) &&
        !has(variables.c.envFrom) && variables.c.env.size() == 1 &&
        variables.c.env[0].name == 'WEFT_POD_UID' &&
        variables.c.env[0].valueFrom.fieldRef.fieldPath == 'metadata.uid'
      message: Only the installation sandbox image, entrypoint and downward pod UID are permitted.
    - expression: >-
        variables.pod.securityContext.runAsUser == 10001 && variables.pod.securityContext.runAsGroup == 10001 &&
        !has(variables.pod.securityContext.fsGroup) && !has(variables.pod.securityContext.supplementalGroups) &&
        !has(variables.c.securityContext.runAsUser) && !has(variables.c.securityContext.runAsGroup) &&
        variables.c.securityContext.readOnlyRootFilesystem == true &&
        variables.c.securityContext.allowPrivilegeEscalation == false
      message: Sandbox commands require the installation UID and a read-only root filesystem.
    - expression: >-
        variables.pod.volumes.size() == 2 && variables.pod.volumes.all(v,
          (v.name == 'workspace' && has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'weft-workspaces') ||
          (v.name == 'scratch' && has(v.emptyDir) && has(v.emptyDir.sizeLimit))) &&
        variables.c.volumeMounts.all(m,
          (m.name == 'workspace' && (m.mountPath == '/workspace' || m.mountPath.startsWith('/workspace/')) &&
           has(m.subPath) && m.subPath.size() > 0 && m.subPath.split('/').all(x, x != '' && x != '.' && x != '..') &&
           !has(m.subPathExpr)) ||
          (m.name == 'scratch' && m.mountPath == '/tmp'))
      message: Only the bounded scratch volume and scoped workspace mounts are permitted.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: weft-replica-sandbox}
spec:
  policyName: weft-replica-sandbox
  validationActions: [Deny]
  matchResources:
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: weft-sandboxes}}
